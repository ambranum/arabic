name: Daily news

# Runs at 22:30 UTC, with a catch-up at 01:00 UTC. Target: the news is IN GIT well before
# 5:30am ISRAEL time.
#
# GitHub cron is UTC with no DST support, and Israel changes offset (IDT = UTC+3 in summer,
# IST = UTC+2 in winter), which pins the window at BOTH ends:
#
#   EARLIEST — the Israeli date has to have rolled over, or israel_today() writes yesterday's
#     id. Israeli midnight is 21:00 UTC in summer but 22:00 UTC in winter, so winter binds:
#     nothing may fire before 22:00 UTC. 22:30 leaves half an hour of margin on that edge.
#   LATEST — 5:30 IDT is 02:30 UTC, and the job is not instant.
#
# Measured runtimes, from the commit timestamps:
#     fired 01:30 UTC  ->  landed 05:42 / 05:49 / 05:48 Israel   (73-79 min, and late daily)
#     fired 23:45 UTC  ->  landed 02:59 Israel                   (14 min)
# The long ones were mostly queue time at the top of the hour; the work itself is quick. Budget
# the bad case anyway: 22:30 + 75 min lands 02:45 IDT / 01:45 IST. Nearly three hours of slack.
#
# THE SECOND SCHEDULE is not belt-and-braces, it is for a failure that has happened: GitHub
# says outright that scheduled workflows may be delayed or dropped under load, and on
# 2026-08-27 this one never fired at all — no run, no news, nothing to notice until you opened
# the app. 01:00 UTC is 04:00 IDT / 03:00 IST, so even a full second run still beats 5:30. It
# passes --skip-if-done, which returns before either API call when the day's file already
# exists, so on a normal day it costs one idle runner minute and no API spend.
#
# Firing before midnight UTC means the runner's UTC date is a day BEHIND Israel, so the date
# has to come from Asia/Jerusalem — israel_today() in pipeline/daily_news.py, and the TZ on the
# commit message below. Change one without the other and the text id and the commit disagree
# about what day it is.
on:
  schedule:
    - cron: '30 22 * * *'   # in git well before 5:30 Israel — writes fresh news, then deploys
    - cron: '0 1 * * *'     # catch-up if the first was dropped; no-op (and no spend) if it wasn't
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [main]
    paths:                  # a code/content push should redeploy — the site is dead
      - 'app/**'            # otherwise until the next 5am run. But DON'T regenerate news
      - '.github/workflows/daily-news.yml'  # on a push (no API spend) — see the guard below.

permissions:
  contents: write           # to commit the day's text back
  pages: write              # to publish
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — rebase/push misbehave on a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write today's news, annotate, voice
        if: github.event_name != 'push'   # a push just redeploys; no news, no API spend
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          # NB: no ELEVENLABS_VOICE_ID here, deliberately. The voice is pinned in
          # pipeline/voice.py so every clip in the app is the same voice. Passing the old
          # repo secret here is what kept generating each new day's news in the OLD voice.
        run: |
          python3 pipeline/daily_news.py --sentences 9 \
            ${{ github.event.schedule == '0 1 * * *' && '--skip-if-done' || '' }}

      # The deploy publishes the runner's working tree, so the day's news reaches the site
      # whether or not this lands. But if it DOESN'T land, the news exists nowhere but that one
      # deployment: the next push-triggered run (which skips generation) rebuilds the site from
      # git and the news silently vanishes. That is exactly what happened on 2026-08-22. So the
      # push still can't block the deploy — but the run goes red at the end if it failed.
      - name: Commit the day's text (can't block the deploy — checked at the end)
        id: commit
        continue-on-error: true
        run: |
          git config user.name  "daily-news"
          git config user.email "actions@github.com"
          git add texts/ build/ app/ pipeline/resolutions.json
          # Israel's date, matching the text id daily_news.py just wrote — NOT the runner's
          # UTC date, which is a day behind at this hour.
          git diff --staged --quiet || git commit -m "news: $(TZ='Asia/Jerusalem' date +%F)"

          # The remote can move between checkout and push — a human commit, or an
          # earlier run. A bare `git push` then dies with "fetch first" and the whole
          # day's work (audio included) is thrown away. Rebase onto whatever landed,
          # then push. Six attempts with backoff, not three: on a day when someone is
          # pushing to main every few minutes, three tries five seconds apart lose.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::could not push the day's news after 6 attempts — it is live on the"
          echo "::error::site but NOT in git, so the next push to main will erase it."
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - uses: actions/deploy-pages@v4

      # Deploy first, then complain. A green run must mean "the news is live AND it will
      # survive the next push" — anything less is the silent failure this job already had once.
      - name: Fail if the day's text never reached git
        if: github.event_name != 'push' && steps.commit.outcome == 'failure'
        run: |
          echo "::error::Today's news deployed to the site but was never committed. It will be"
          echo "::error::overwritten by the next push to main. Re-run this workflow to restore it."
          exit 1
