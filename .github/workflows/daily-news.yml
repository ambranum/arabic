name: Daily news

# Runs at 01:30 UTC — ready by ~5am ISRAEL time.
#
# GitHub cron is UTC with no DST support, and Israel changes offset (IDT = UTC+3 in
# summer, IST = UTC+2 in winter). 01:30 UTC = 4:30am IDT (summer) / 3:30am IST (winter),
# so it lands BEFORE 5am year-round — deliberately a touch early rather than late, with
# buffer for GitHub delaying scheduled jobs (often 10+ minutes). To shift it, change the
# UTC time below: 02:00 UTC = 5am IDT exactly (summer), but risks running a few min late.
on:
  schedule:
    - cron: '30 1 * * *'    # ~5am Israel — writes fresh news, then deploys
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [main]
    paths:                  # a code/content push should redeploy — the site is dead
      - 'app/**'            # otherwise until the next 5am run. But DON'T regenerate news
      - '.github/workflows/daily-news.yml'  # on a push (no API spend) — see the guard below.

permissions:
  contents: write           # to commit the day's text back
  pages: write              # to publish
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — rebase/push misbehave on a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write today's news, annotate, voice
        if: github.event_name != 'push'   # a push just redeploys; no news, no API spend
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          # NB: no ELEVENLABS_VOICE_ID here, deliberately. The voice is pinned in
          # pipeline/voice.py so every clip in the app is the same voice. Passing the old
          # repo secret here is what kept generating each new day's news in the OLD voice.
        run: python3 pipeline/daily_news.py --sentences 9

      - name: Commit the day's text (advisory — never blocks the deploy)
        continue-on-error: true
        run: |
          git config user.name  "daily-news"
          git config user.email "actions@github.com"
          git add texts/ build/ app/ pipeline/resolutions.json
          git diff --staged --quiet || git commit -m "news: $(date -u +%F)"

          # The remote can move between checkout and push — a human commit, or an
          # earlier run. A bare `git push` then dies with "fetch first" and the whole
          # day's work (audio included) is thrown away. Rebase onto whatever landed,
          # then push. Retry once for the narrow race where it moves again mid-rebase.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - uses: actions/deploy-pages@v4
