name: Hebrew books

# The Ben-Yehuda shelf, finished off where the key already lives.
#
# pipeline/he_books.py selects the texts and needs nothing but the dump; the two steps that
# finish them need Claude — the English, and the ~2,000 sense decisions the annotator cannot
# make on its own. Both were meant to run on the laptop, and could not: `anthropic` is not
# installed for any interpreter there, and pip could not reach pypi.org.
#
# It runs here instead, which is better anyway. ANTHROPIC_API_KEY is already a repo secret,
# requirements.txt is already installed by every run, and the artifacts land in git rather than
# in someone's working copy. Manual only — this spends money, so nothing fires it but a person.
#
# Cost, measured on the shelf as selected: 10 texts, 6,803 tokens, 30% of them needing a
# decision after the source's own pointing has settled what it can. That is ~2,000 decisions in
# batches of 40, plus ~600 sentences of translation in batches of 25.

on:
  workflow_dispatch:
    inputs:
      translate:
        description: 'Write the English (skip if it is already done)'
        type: boolean
        default: true
      annotate:
        description: 'Annotate and adjudicate (the expensive half)'
        type: boolean
        default: true

concurrency:
  group: hebrew-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — rebase/push misbehave on a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the English
        if: inputs.translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/he_books.py --lang he --translate

      # Per text, not all at once: a failure halfway through leaves the ones already done in the
      # tree and adjudicated, and the resolution trail means a re-run does not pay for them
      # twice. `set -e` off for the loop so one bad text cannot cost the other nine.
      - name: Annotate and adjudicate
        if: inputs.annotate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          rc=0
          for f in texts/he/book-by-*.json; do
            echo "::group::$f"
            python3 pipeline/daily_news.py --lang he --adjudicate "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Rebuild the Hebrew app data
        run: python3 pipeline/build_app.py --lang he

      - name: Commit
        run: |
          git config user.name  "hebrew-books"
          git config user.email "actions@github.com"
          git add texts/ build/ app/ pipeline/resolutions.he.json
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Hebrew books: English and annotation"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main; then
              git push && exit 0
            else
              git rebase --abort || true
              git stash pop 2>/dev/null || true
              echo "rebase conflicted on attempt $attempt — tree restored"
            fi
            sleep $((attempt * 10))
          done
          echo "::error::could not push after 6 attempts"
          exit 1
