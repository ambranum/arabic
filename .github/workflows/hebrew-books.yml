name: Hebrew content

# The Ben-Yehuda shelf, finished off where the key already lives.
#
# pipeline/he_books.py selects the texts and needs nothing but the dump; the two steps that
# finish them need Claude — the English, and the ~2,000 sense decisions the annotator cannot
# make on its own. Both were meant to run on the laptop, and could not: `anthropic` is not
# installed for any interpreter there, and pip could not reach pypi.org.
#
# It runs here instead, which is better anyway. ANTHROPIC_API_KEY is already a repo secret,
# requirements.txt is already installed by every run, and the artifacts land in git rather than
# in someone's working copy. Manual only — this spends money, so nothing fires it but a person.
#
# Cost, measured on the shelf as selected: 37 texts, 31,354 tokens, 2,675 sentences. Ten of
# them are finished; the other 27 need 1,988 sentences of English, ~24,500 words of annotation
# at roughly 30% needing a decision after the source's own pointing has settled what it can,
# and 1,988 sentence clips. The audio is by far the largest line and can be run on its own
# later -- a book with no clips reads fine and says so.

on:
  workflow_dispatch:
    inputs:
      translate:
        description: 'Write the English — 1,988 sentences on the 27 new books. ~80 batches'
        type: boolean
        default: false
      annotate:
        description: 'Annotate and adjudicate the books, stories and news — 27 new books, ~24,500 words'
        type: boolean
        default: true
      audio:
        description: 'Voice every book and story sentence — 1,287 done, 1,988 new. The big one'
        type: boolean
        default: true
      vocab:
        description: 'Voice every word for the flashcards (~1,550 clips, ElevenLabs)'
        type: boolean
        default: true

concurrency:
  group: hebrew-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — rebase/push misbehave on a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the English
        if: inputs.translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/he_books.py --lang he --translate

      - name: Save the English
        if: always()
        run: bash pipeline/ci_commit.sh "the English for the shelf"

      # Per text, not all at once: a failure halfway through leaves the ones already done in the
      # tree and adjudicated, and the resolution trail means a re-run does not pay for them
      # twice. `set -e` off for the loop so one bad text cannot cost the other nine.
      #
      # The news is in the glob even though daily-news.yml adjudicates each morning's article as
      # it writes it. A change to the lexicon can make a text that was settled ambiguous again,
      # and the daily job never looks back: dropping the infinitive ל from OWN_PREFIX left
      # fifteen words unresolved across three archived articles, in a paper nothing would have
      # revisited. A text with nothing ambiguous costs one file read and no API call.
      - name: Annotate and adjudicate
        if: inputs.annotate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          rc=0
          for f in texts/he/book-by-*.json texts/he/story-*.json texts/he/news-*.json; do
            echo "::group::$f"
            python3 pipeline/daily_news.py --lang he --adjudicate "$f"; s=$?
            echo "::endgroup::"
            [ $s -eq 0 ] && continue
            rc=1
            # 2 means the API itself is unavailable to us -- an empty balance, a dead key. The
            # next hundred texts will fail identically, and the step after this one commits what
            # has already been bought, so stopping here is what keeps it.
            [ $s -eq 2 ] && { echo "::error::stopping: the API is unavailable, see above"; break; }
          done
          exit $rc

      - name: Save the annotation
        if: always()
        run: bash pipeline/ci_commit.sh "annotation and sense decisions"

      # Last, so the artifact it writes is the annotated one. Clips already on disk are
      # ADOPTED rather than remade -- under a non-deterministic model that is not an
      # optimisation, it is the only way a re-run does not change how a sentence is read -- so
      # this is safe to run again after a failure and only pays for what is missing.
      - name: Voice the sentences
        if: inputs.audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # No ELEVENLABS_VOICE_ID, deliberately: the voice is pinned in pipeline/voice.py so
          # the books are read in the same voice as the news and the reactions.
        run: |
          rc=0
          for f in texts/he/book-by-*.json texts/he/story-*.json; do
            echo "::group::$f"
            python3 pipeline/he_ingest.py "$f" --lang he --audio; s=$?
            echo "::endgroup::"
            [ $s -eq 0 ] && continue
            rc=1
            # Same contract as the annotate loop: 2 is the API being unavailable to us, not
            # this text being bad. The save step behind this one keeps the clips already made.
            [ $s -eq 2 ] && { echo "::error::stopping: the voice API is unavailable, see above"; break; }
          done
          exit $rc

      - name: Save the sentence audio
        if: always()
        run: bash pipeline/ci_commit.sh "book and story audio"

      # Every word the app's own content contains, one clip each, so a flashcard plays the
      # pinned voice instead of the browser's. Drawn from the ingested texts, so it must run
      # after them; cached by a hash of the lemma, so a re-run only pays for what is new.
      - name: Voice the vocabulary
        if: inputs.vocab
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 pipeline/vocab_audio.py --lang he

      - name: Rebuild the Hebrew app data
        if: always()
        run: python3 pipeline/build_app.py --lang he

      - name: Save the vocabulary audio and the rebuilt app
        if: always()
        run: bash pipeline/ci_commit.sh "vocabulary audio"
