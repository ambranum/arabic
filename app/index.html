<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDEDE6">
<title>Palestinian Arabic</title>
<style>
  :root{
    --paper:#EDEDE6; --paper-2:#E4E4DB; --paper-3:#DADAD0;
    --ink:#15161A; --ink-soft:#4A4B52; --muted:#7A7A72; --rule:#C9C9BE;
    --rubric:#B4372A; --verdigris:#2F6B63; --verdigris-2:#E0EAE7;
    --ochre:#C8912F; --ochre-wash:rgba(200,145,47,.17);
    --serif:"Iowan Old Style","Charter",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --arabic:"Geeza Pro","SF Arabic","Damascus","Al Bayan",serif;
    --tray:60px;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#16171B; --paper-2:#1E1F24; --paper-3:#292A30;
    --ink:#E4E3DC; --ink-soft:#A9A9A2; --muted:#82827B; --rule:#33343B;
    --rubric:#FF7B62; --verdigris:#63B3A5; --verdigris-2:#1C2E2C;
    --ochre:#D9A94D; --ochre-wash:rgba(217,169,77,.15);}}
  :root[data-theme="dark"]{
    --paper:#16171B; --paper-2:#1E1F24; --paper-3:#292A30;
    --ink:#E4E3DC; --ink-soft:#A9A9A2; --muted:#82827B; --rule:#33343B;
    --rubric:#FF7B62; --verdigris:#63B3A5; --verdigris-2:#1C2E2C;
    --ochre:#D9A94D; --ochre-wash:rgba(217,169,77,.15);}
  :root[data-theme="light"]{
    --paper:#EDEDE6; --paper-2:#E4E4DB; --paper-3:#DADAD0;
    --ink:#15161A; --ink-soft:#4A4B52; --muted:#7A7A72; --rule:#C9C9BE;
    --rubric:#B4372A; --verdigris:#2F6B63; --verdigris-2:#E0EAE7;
    --ochre:#C8912F; --ochre-wash:rgba(200,145,47,.17);}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans);
       -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
  .wrap{max-width:760px; margin:0 auto; padding:20px 18px calc(var(--tray) + 34px)}

  /* ---------- chrome ---------- */
  .top{display:flex; align-items:baseline; gap:12px; padding-bottom:14px;
       border-bottom:1px solid var(--rule); margin-bottom:20px}
  .top h1{font-family:var(--serif); font-size:20px; font-weight:400; margin:0;
          letter-spacing:-.01em}
  .top .sp{flex:1}
  .back{font:inherit; font-size:13px; color:var(--verdigris); background:none;
        border:none; padding:6px 0; cursor:pointer}
  .back:hover{text-decoration:underline}

  /* ---------- hamburger + sidebar drawer ---------- */
  .ham{flex:none; width:36px; height:36px; margin:-4px 4px -4px -6px; padding:0; cursor:pointer;
       display:inline-flex; align-items:center; justify-content:center; border:none;
       border-radius:8px; background:none; color:var(--ink)}
  .ham:hover{background:var(--paper-2)}
  .ham:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}

  /* classic dark sidebar, always dark for that contrast against the page */
  .sidebar{position:fixed; top:0; left:0; bottom:0; z-index:80; width:264px; max-width:84vw;
           background:#181a22; color:#d7dae2; transform:translateX(-100%);
           transition:transform .22s ease; display:flex; flex-direction:column;
           padding:18px 12px calc(18px + env(safe-area-inset-bottom));
           overflow-y:auto; box-shadow:2px 0 24px rgba(0,0,0,.28)}
  .sidebar.open{transform:none}
  .side-brand{display:flex; flex-direction:column; gap:2px; padding:6px 12px 16px;
      font-family:var(--arabic); font-size:26px; direction:rtl; color:#fff; line-height:1}
  .side-brand span{font-family:var(--serif); font-size:13px; direction:ltr; color:#8b90a0}
  .side-sep{height:1px; background:rgba(255,255,255,.09); margin:8px 10px}

  #nav{display:flex; flex-direction:column; gap:3px}
  .navb{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
        font:inherit; font-size:14.5px; cursor:pointer; padding:11px 12px; border:none;
        border-radius:9px; background:none; color:#aeb2c0}
  .navb svg{flex:none; opacity:.85}
  .navb:hover{background:rgba(255,255,255,.06); color:#fff}
  .navb.on{background:var(--verdigris); color:#fff; font-weight:600}
  .navb.on svg{opacity:1}
  .navb em{margin-left:auto; font-style:normal; font-size:9.5px; letter-spacing:.06em;
           text-transform:uppercase; color:var(--ochre); opacity:.9}
  .navb:focus-visible{outline:2px solid var(--verdigris); outline-offset:-2px}

  .side-scrim{position:fixed; inset:0; z-index:75; background:rgba(0,0,0,.4)}

  /* section tiles on the home page */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
  .tile{text-align:left; font:inherit; cursor:pointer; border:1px solid var(--rule);
        background:none; color:var(--ink); border-radius:7px; padding:16px}
  .tile:hover{border-color:var(--verdigris)}
  .tile:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .tile-t{font-family:var(--serif); font-size:17px; line-height:1.2}
  .tile-s{font-size:12px; color:var(--muted); margin-top:6px}
  .tile.soon{opacity:.62}
  .tile.soon .tile-s{color:var(--ochre)}

  /* empty section placeholder */
  .empty{text-align:center; padding:56px 20px; color:var(--muted)}
  .empty-t{font-family:var(--serif); font-size:22px; color:var(--ink-soft); margin-bottom:8px}
  .empty p{font-size:14px; line-height:1.6; margin:0}

  /* ---------- home ---------- */
  .hero{display:grid; gap:12px; margin:4px 0 26px}
  .big{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
       border:1px solid var(--rule); background:none; color:var(--ink);
       border-radius:8px; padding:20px; position:relative}
  .big:hover{border-color:var(--verdigris); background:var(--verdigris-2)}
  .big:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .big .k{font-size:10px; letter-spacing:.13em; text-transform:uppercase;
          color:var(--verdigris); font-weight:700}
  .big .t{font-family:var(--serif); font-size:23px; margin-top:5px; line-height:1.25}
  .big .s{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5}
  .big.warn{border-color:var(--ochre)}
  .big.warn .k{color:var(--ochre)}
  .big .ar{font-family:var(--arabic); direction:rtl; font-size:21px; margin-top:6px;
           color:var(--ink-soft)}
  .cmd{font-family:var(--mono); font-size:11.5px; background:var(--paper-2);
       border:1px solid var(--rule); border-radius:4px; padding:9px 11px; margin-top:10px;
       overflow-x:auto; white-space:pre; color:var(--ink-soft)}

  /* ---------- library ---------- */
  .sec{font-size:10px; letter-spacing:.13em; text-transform:uppercase;
       color:var(--muted); font-weight:700; margin:26px 0 10px}
  .card{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
        border:1px solid var(--rule); background:none; color:var(--ink);
        border-radius:6px; padding:15px 16px; margin-bottom:10px}
  .card:hover{border-color:var(--verdigris)}
  .card:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .card .ar{font-family:var(--arabic); direction:rtl; font-size:24px; line-height:1.7}
  .card .en{font-family:var(--serif); font-size:16px; margin-top:1px}
  .card .meta{font-size:11.5px; color:var(--muted); margin-top:7px;
              display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .pill{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em;
        text-transform:uppercase; border:1px solid var(--rule); border-radius:2px;
        padding:2px 6px; color:var(--muted)}
  .pill.on{border-color:var(--verdigris); color:var(--verdigris)}
  .pill.off{opacity:.55}

  /* ---------- reader ---------- */
  .ctl{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
  .tog{font:inherit; font-size:12.5px; padding:6px 12px; border:1px solid var(--rule);
       background:none; color:var(--ink-soft); border-radius:14px; cursor:pointer}
  .tog[aria-pressed="true"]{background:var(--verdigris); border-color:var(--verdigris);
       color:var(--paper); font-weight:500}
  .tog:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}

  .unval{font-size:12px; line-height:1.55; color:var(--ink-soft); border:1px solid var(--ochre);
         background:var(--ochre-wash); border-radius:5px; padding:10px 12px; margin-bottom:18px}
  .unval b{color:var(--ochre)}
  .sent{padding:15px 0; border-bottom:1px solid var(--rule)}
  .sent:last-child{border-bottom:none}
  .ar{font-family:var(--arabic); direction:rtl; text-align:right;
      font-size:31px; line-height:2.1; color:var(--ink)}
  /* Own line-height: an inline-block inherits the 2.1 leading and the highlight
     becomes a tall block instead of hugging the word. */
  .w{display:inline-block; cursor:pointer; padding:2px 3px; border-radius:3px;
     line-height:1.3}
  .w:hover{background:var(--verdigris-2)}
  .w:focus-visible{outline:2px solid var(--verdigris); outline-offset:1px}
  .w.mk{background:var(--ochre-wash); box-shadow:inset 0 -2px 0 var(--ochre)}
  .w.sel{background:var(--verdigris); color:var(--paper)}
  .w.gap{border-bottom:1px dotted var(--muted)}
  /* Vowels toggle: both spellings are in the DOM, CSS picks one. */
  .w .v{display:none}
  .rd[data-voc="on"] .w .v{display:inline}
  .rd[data-voc="on"] .w .p{display:none}
  /* Vowel marks sit above the line, so they need more leading to clear the row above. */
  .rd[data-voc="on"] .ar{line-height:2.4}

  /* Scoped to .rd — an unscoped .en also matched the library card titles and hid them. */
  .rd .en{display:none; font-family:var(--serif); font-size:16px; line-height:1.55;
      font-style:italic; color:var(--ink-soft); margin-top:11px; padding-left:12px;
      border-left:2px solid var(--rule)}
  .rd[data-en="on"] .en{display:block}
  .sent.peek .en{display:block}
  .peek{font:inherit; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
        color:var(--muted); background:none; border:none; padding:7px 0 0 14px; cursor:pointer}
  .rd[data-en="on"] .peek{display:none}
  /* ---------- inline audio player (one per line) ---------- */
  .noaud{display:inline-block; font-size:12px; color:var(--muted); font-style:italic; margin-top:9px}
  .player{display:flex; align-items:center; gap:9px; margin-top:11px; flex-wrap:wrap;
          direction:ltr}
  .player .pp{flex:none; width:32px; height:32px; border-radius:50%; cursor:pointer;
      border:1px solid var(--verdigris); background:var(--verdigris); color:var(--paper);
      display:inline-flex; align-items:center; justify-content:center; padding:0}
  .player .pp::before{content:""; width:0; height:0; margin-left:2px;
      border-left:9px solid currentColor; border-top:6px solid transparent;
      border-bottom:6px solid transparent}                 /* ▶ triangle */
  .player.playing .pp::before{content:""; margin:0; width:8px; height:10px; border:none;
      border-left:3px solid currentColor; border-right:3px solid currentColor}  /* ❚❚ */
  .player .pp:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .player .t-cur, .player .t-dur{font-family:var(--mono); font-size:10.5px; color:var(--muted);
      font-variant-numeric:tabular-nums; min-width:26px; text-align:center}

  /* the scrubber — a range input styled as a filled progress bar */
  .player .seek{flex:1 1 90px; min-width:90px; height:20px; -webkit-appearance:none;
      appearance:none; background:none; cursor:pointer; margin:0}
  .player .seek::-webkit-slider-runnable-track{height:5px; border-radius:3px;
      background:linear-gradient(to right, var(--verdigris) var(--fill,0%), var(--paper-3) var(--fill,0%))}
  .player .seek::-moz-range-track{height:5px; border-radius:3px; background:var(--paper-3)}
  .player .seek::-moz-range-progress{height:5px; border-radius:3px; background:var(--verdigris)}
  .player .seek::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px;
      border-radius:50%; background:var(--verdigris); margin-top:-4.5px;
      box-shadow:0 0 0 3px var(--paper)}
  .player .seek::-moz-range-thumb{width:14px; height:14px; border:none; border-radius:50%;
      background:var(--verdigris); box-shadow:0 0 0 3px var(--paper)}
  .player .seek:focus-visible{outline:none}
  .player .seek:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--verdigris)}

  .pspd{display:inline-flex; border:1px solid var(--rule); border-radius:13px; overflow:hidden}
  .pspd .sb{font:inherit; font-size:11px; padding:4px 9px; border:none; cursor:pointer;
      border-left:1px solid var(--rule); background:none; color:var(--ink-soft);
      font-variant-numeric:tabular-nums}
  .pspd .sb:first-child{border-left:none}
  .pspd .sb[aria-pressed="true"]{background:var(--verdigris); color:var(--paper); font-weight:600}
  .pspd .sb:focus-visible{outline:2px solid var(--verdigris); outline-offset:-2px}

  /* ---------- word card: bottom sheet on phone, popover on desktop ---------- */
  .cardwrap{position:fixed; inset:0; z-index:60; display:none}
  .cardwrap.on{display:block}
  .scrim{position:absolute; inset:0; background:rgba(0,0,0,.28)}
  .wc{position:absolute; left:0; right:0; bottom:0; background:var(--paper);
      border-top:1px solid var(--rule); border-radius:12px 12px 0 0;
      padding:18px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow:0 -8px 30px rgba(0,0,0,.2); max-height:78vh; overflow-y:auto}
  @media(min-width:620px){
    .scrim{background:transparent}
    .wc{left:50%; right:auto; bottom:auto; transform:translateX(-50%);
        top:12vh; width:340px; border:1px solid var(--rule); border-radius:7px;
        box-shadow:0 16px 44px rgba(0,0,0,.22); padding:18px}
  }
  .wc .hw{font-family:var(--arabic); direction:rtl; font-size:32px; line-height:1.6}
  .wc .ph{font-family:var(--mono); font-size:13px; color:var(--verdigris); margin-top:2px}
  .wc .gl{font-family:var(--serif); font-size:18px; margin:10px 0 14px; line-height:1.4}
  .wc dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 14px;
         padding-top:12px; border-top:1px solid var(--rule); font-size:13.5px}
  .wc dt{color:var(--muted); font-size:10px; letter-spacing:.08em;
         text-transform:uppercase; padding-top:3px}
  .wc dd{margin:0}
  .wc dd.rtl{font-family:var(--arabic); direction:rtl; text-align:left; font-size:19px}
  .wc .src{font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:12px}
  .wc .acts{display:flex; gap:8px}
  .wc .acts button{flex:1; font:inherit; font-size:14px; padding:11px;
      border:1px solid var(--rule); background:none; color:var(--ink-soft);
      border-radius:5px; cursor:pointer}
  .wc .acts button.mk[data-on="1"]{border-color:var(--ochre); color:var(--ochre);
      background:var(--ochre-wash); font-weight:600}
  .wc .acts button:disabled{opacity:.35; cursor:default}

  /* ---------- drill ---------- */
  .ch{border:1px solid var(--rule); border-radius:6px; padding:14px 16px; margin-bottom:9px}
  .ch .q{font-family:var(--serif); font-size:17px}
  .ch .a{font-family:var(--arabic); direction:rtl; text-align:right; font-size:27px;
         line-height:1.8; margin-top:6px; filter:blur(7px); cursor:pointer;
         transition:filter .12s}
  .ch .a.show{filter:none}
  .ch .u{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.45}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.55; margin:0 0 16px}

  /* ---------- tray ---------- */
  .tray{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--paper);
        border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom)}
  .tray .in{max-width:760px; margin:0 auto; padding:11px 18px; display:flex;
            align-items:center; gap:14px; min-height:var(--tray)}
  .tray .n{font-size:13px; color:var(--ink-soft); white-space:nowrap}
  .tray .n b{color:var(--ochre); font-variant-numeric:tabular-nums}
  .tray .sp{flex:1}
  .tray button{font:inherit; font-size:13px; padding:8px 14px; border-radius:5px;
               cursor:pointer; border:1px solid var(--rule); background:none;
               color:var(--ink-soft); white-space:nowrap}
  .tray button.go{background:var(--verdigris); border-color:var(--verdigris);
                  color:var(--paper)}
  .tray button:disabled{opacity:.4; cursor:default}

  .note{font-size:12px; line-height:1.6; color:var(--muted); border:1px solid var(--rule);
        border-radius:5px; padding:11px 13px; margin-top:22px}
  .note b{color:var(--ink-soft)}
  /* ---------- verbs ---------- */
  .vsearch{width:100%; font:inherit; font-size:15px; padding:11px 14px; margin:2px 0 6px;
      border:1px solid var(--rule); border-radius:8px; background:var(--paper-2);
      color:var(--ink); -webkit-appearance:none}
  .vsearch:focus{outline:none; border-color:var(--verdigris); background:var(--paper)}
  .vsearch::placeholder{color:var(--muted)}

  .vtiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media(max-width:560px){.vtiles{grid-template-columns:1fr}}
  .vtile{text-align:left; font:inherit; cursor:pointer; border:1px solid var(--rule);
      background:none; color:var(--ink); border-radius:8px; padding:14px 15px}
  .vtile.wide{width:100%}
  .vtile:hover{border-color:var(--verdigris); background:var(--verdigris-2)}
  .vtile:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .vtile-h{display:flex; align-items:baseline; gap:9px}
  .vtile-t{font-family:var(--serif); font-size:17px; line-height:1.2}
  .vtile-n{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--verdigris);
      font-variant-numeric:tabular-nums}
  .vtile-s{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5}

  .vlist{display:grid; gap:10px}
  .vc{border:1px solid var(--rule); border-radius:8px; padding:13px 15px; background:var(--paper-2)}
  .vc-h{display:flex; align-items:baseline; gap:10px}
  .vc-gl{font-family:var(--serif); font-size:16px; line-height:1.3; color:var(--ink)}
  .vc-badges{margin-left:auto; display:flex; gap:6px; flex:none}
  .b-form,.b-wk{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em;
      text-transform:uppercase; border-radius:3px; padding:2px 7px; white-space:nowrap}
  .b-form{background:var(--verdigris); color:var(--paper); font-weight:600}
  .b-wk{border:1px solid var(--ochre); color:var(--ochre)}
  .vc-root{font-family:var(--arabic); direction:rtl; text-align:right; font-size:15px;
      color:var(--muted); margin:2px 0 11px}
  .vc-pp{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .pp{display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px;
      background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:9px 6px}
  .pp-k{font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .pp-ar{font-family:var(--arabic); direction:rtl; font-size:23px; line-height:1.45; color:var(--ink)}
  .pp-c{font-family:var(--mono); font-size:11px; color:var(--verdigris); word-break:break-all}
  .b-cj{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
      border-radius:3px; padding:2px 7px; background:var(--verdigris-2); color:var(--verdigris);
      border:1px solid var(--verdigris)}
  .vc{cursor:pointer; width:100%; text-align:left; font:inherit; color:var(--ink)}

  /* ---- verb detail / conjugation ---- */
  .vd-head{display:flex; align-items:baseline; gap:14px; margin:2px 0 20px;
      padding-bottom:16px; border-bottom:1px solid var(--rule)}
  .vd-ar{font-family:var(--arabic); direction:rtl; font-size:38px; line-height:1.1; color:var(--ink)}
  .vd-gl{font-family:var(--serif); font-size:18px; line-height:1.3}
  .vd-sub{font-size:12.5px; color:var(--muted); margin-top:5px}
  .vd-sub .b-form,.vd-sub .b-wk{font-size:9.5px}

  .cj-tbl{display:grid; gap:6px; margin-bottom:20px}
  .cj-row{display:grid; grid-template-columns:minmax(58px,0.8fr) 1fr 1fr 1fr; gap:6px; align-items:stretch}
  .cj-hdr{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
      font-weight:700; padding:0 2px}
  .cj-hdr>div{padding:2px 4px}
  .cj-pr{display:flex; flex-direction:column; justify-content:center; gap:1px; padding:6px 4px}
  .cj-pr-ar{font-family:var(--arabic); direction:rtl; font-size:16px; color:var(--ink-soft); line-height:1.2}
  .cj-pr-en{font-size:10px; color:var(--muted)}
  .cj-cell{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      text-align:center; background:var(--paper-2); border:1px solid var(--rule); border-radius:6px;
      padding:8px 5px}
  .cj-ar{font-family:var(--arabic); direction:rtl; font-size:21px; line-height:1.4; color:var(--ink)}
  .cj-ph{font-family:var(--mono); font-size:10.5px; color:var(--verdigris); word-break:break-all}
  .cj-k{font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .cj-mini{margin-bottom:16px}
  .cj-mini-row{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  @media(max-width:520px){
    .cj-ar{font-size:18px} .cj-cell{padding:7px 3px} .cj-row{gap:4px}
    .cj-pr-ar{font-size:14px}
  }

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="ham" id="ham" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="title" onclick="location.hash='/'" style="cursor:pointer">Palestinian Arabic</h1>
    <span class="sp"></span>
    <button class="back" id="back" hidden>&larr; Back</button>
  </div>
  <aside class="sidebar" id="sidebar" aria-hidden="true" aria-label="Sections">
    <div class="side-brand">القهوة<span>Palestinian Arabic</span></div>
    <nav id="nav"></nav>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>
  <div id="view"></div>
</div>

<div class="cardwrap" id="cw"><div class="scrim" id="scrim"></div><div class="wc" id="wc"></div></div>

<div class="tray"><div class="in">
  <span class="n"><b id="cnt">0</b> words to learn</span>
  <span class="sp"></span>
  <button id="rev">Review</button>
  <button class="go" id="exp">Export</button>
</div></div>

<script src="data/library.js"></script>
<script src="data/verbs.js"></script>
<script>
// ---------- persistence ----------
// localStorage: survives closing the tab, lives on this device, no server involved.
// Keyed by LEMMA so a word you marked in one text is known in every text.
const KEY = 'alp.marked.v1';
let marked = new Map();
try { marked = new Map(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...marked])); } catch (e) {} };

// Playback speed. Slow is the single most useful setting for dialect — a Palestinian
// sentence at full pace is a wall; at 0.5x you can actually pick the words apart. Kept
// in its own localStorage key so it persists across sessions like the marked list.
const SKEY = 'alp.speed.v1';
let SPEED = parseFloat(localStorage.getItem(SKEY)) || 1;
const setSpeed = v => { SPEED = v; try { localStorage.setItem(SKEY, String(v)); } catch (e) {} };

// ---------- one real audio engine, many inline players ----------
// A single <audio> is reused for every line. Only one clip is ever audible; hitting play
// on a new line re-points this element and resets the previous line's transport. The
// per-line player UI (play/pause, scrubber, speed) binds to whichever line is active.
const A = new Audio();
A.preservesPitch = true; A.mozPreservesPitch = true; A.webkitPreservesPitch = true;
let activeSrc = null;

const fmt = t => (isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '0:00');

function activePlayer() {
  return activeSrc ? document.querySelector(`.player[data-src="${cssq(activeSrc)}"]`) : null;
}
function cssq(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function resetPlayer(pl) {
  if (!pl) return;
  pl.classList.remove('playing');
  const seek = pl.querySelector('.seek'); if (seek) { seek.value = 0; seek.style.setProperty('--fill','0%'); }
  const cur = pl.querySelector('.t-cur'); if (cur) cur.textContent = '0:00';
}

function playSrc(pl) {
  const src = pl.dataset.src;
  if (activeSrc !== src) {
    resetPlayer(activePlayer());          // hand the audio over from the old line
    activeSrc = src;
    A.src = src;
  }
  A.playbackRate = SPEED;
  A.play().catch(() => {});
  pl.classList.add('playing');
}
function toggleSrc(pl) {
  if (activeSrc === pl.dataset.src && !A.paused) { A.pause(); pl.classList.remove('playing'); }
  else playSrc(pl);
}

A.addEventListener('timeupdate', () => {
  const pl = activePlayer(); if (!pl) return;
  const pct = A.duration ? (A.currentTime / A.duration * 100) : 0;
  const seek = pl.querySelector('.seek');
  if (seek && document.activeElement !== seek) {   // don't fight a finger that's dragging
    seek.value = pct; seek.style.setProperty('--fill', pct + '%');
  }
  const cur = pl.querySelector('.t-cur'); if (cur) cur.textContent = fmt(A.currentTime);
});
A.addEventListener('loadedmetadata', () => {
  const pl = activePlayer(); if (!pl) return;
  const dur = pl.querySelector('.t-dur'); if (dur) dur.textContent = fmt(A.duration);
});
A.addEventListener('ended', () => { const pl = activePlayer(); resetPlayer(pl); });
A.addEventListener('pause', () => { const pl = activePlayer(); if (pl) pl.classList.remove('playing'); });

// Called from the delegated input handler when a scrubber is dragged.
function seekTo(pl, pct) {
  if (activeSrc !== pl.dataset.src) { activeSrc = pl.dataset.src; A.src = pl.dataset.src; }
  const set = () => { A.currentTime = (pct/100) * (A.duration || 0);
                      pl.querySelector('.seek').style.setProperty('--fill', pct + '%'); };
  if (A.duration) set(); else A.addEventListener('loadedmetadata', set, {once:true});
}

// Change speed everywhere; apply live if something is playing. Persisted (SKEY).
function applySpeed(v, pl) {
  setSpeed(v);
  A.playbackRate = v;
  document.querySelectorAll('.pspd .sb').forEach(b =>
    b.setAttribute('aria-pressed', String(parseFloat(b.dataset.spd) === v)));
}

// The inline player component — one per line. LTR so the scrubber fills left→right even
// though the Arabic around it is RTL. Disabled lines show a plain note instead.
function player(src) {
  if (!src) return `<span class="noaud">no audio yet</span>`;
  return `<div class="player" data-src="${esc(src)}" dir="ltr">
      <button class="pp" aria-label="Play / pause"></button>
      <span class="t-cur">0:00</span>
      <input class="seek" type="range" min="0" max="100" value="0" step="0.5"
             aria-label="Seek" style="--fill:0%">
      <span class="t-dur">0:00</span>
      <div class="pspd" role="group" aria-label="Speed">
        ${[[0.5,'0.5×'],[0.9,'0.9×'],[1,'1×']].map(([v,t]) =>
          `<button class="sb" data-spd="${v}" aria-pressed="${SPEED===v}">${t}</button>`).join('')}
      </div>
    </div>`;
}

const VOCSRC = {
  'lexicon:exact'              : 'straight from the lexicon',
  'derived:affix'              : 'lexicon stem + prefix rule',
  'derived:verb'               : 'lexicon stem — prefix vowel is our best call',
  'unvocalized:weak-final-verb': "not shown — we couldn't derive it honestly",
  'unvocalized:no-alignment'   : "not shown — couldn't match the dictionary form",
  'unvocalized:no-entry'       : 'not in the lexicon',
  'curated'                    : 'hand-written by us, not from the lexicon',
  'unvocalized:curated-with-clitic': 'not shown — name carries a prefix'
};
const LIB = window.LIBRARY || {texts: [], drills: []};

// ---------- verbs ----------
// Sourced from Maknuune: root, gloss, the three principal parts (past / present / command)
// and their pronunciation are looked up, never generated. The Form (measure I–X) and the
// weak class are computed by pipeline/verbforms.py from the perfect form + root.
const VB = (window.VERBS && window.VERBS.verbs) || [];
VB.forEach((v, i) => v._i = i);          // stable index for detail-view routing
const FORM_ORDER = ['I','II','III','IV','V','VI','VII','VIII','X','Q'];
// One honest line on what each measure tends to do. Patterns, not promises — a given verb
// can drift from its measure's core sense, so these orient rather than define.
const FORM_INFO = {
  I:   ['Form I',        'The base verb — the plain action. كتب “he wrote”.'],
  II:  ['Form II',       'Doubled middle root letter. Often intensive or causative — درّس “he taught”.'],
  III: ['Form III',      'Long vowel after the first letter. Doing something to or with someone — كاتب “he corresponded”.'],
  IV:  ['Form IV',       'Causative. Rare in dialect; usually surfaces as Form I or II instead.'],
  V:   ['Form V',        'Form II with a t- prefix. Reflexive of II — تعلّم “he learned”.'],
  VI:  ['Form VI',       'Form III with a t- prefix. Reciprocal — تكاتبوا “they wrote to each other”.'],
  VII: ['Form VII',      'n- prefix. Passive or medio-passive — انكسر “it broke”.'],
  VIII:['Form VIII',     'Infixed -t-. Often middle voice or reflexive — اشتغل “he worked”.'],
  X:   ['Form X',        'ista- prefix. Seeking or considering — استعمل “he used”.'],
  Q:   ['Quadriliteral', 'Four-consonant roots, including loanwords — تلفن “he phoned”.'],
};
const WEAK_INFO = {
  hollow:      ['Hollow',      'Middle root letter is و or ي and drops or shifts — راح / يروح.'],
  defective:   ['Defective',   'Final root letter is و or ي — مشي / يمشي.'],
  doubled:     ['Doubled',     'Last two root letters are the same, written with shadda — حبّ / يحبّ.'],
  assimilated: ['Assimilated', 'First root letter is و and often drops in the present — وصل / يوصل.'],
  hamzated:    ['Hamzated',    'A root letter is hamza (ء) — أكل / ياكل.'],
};
const WEAK_ORDER = ['hollow','defective','doubled','assimilated','hamzated'];
const byForm = f => VB.filter(v => v.form === f);
const irregular = VB.filter(v => WEAK_INFO[v.weak]);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pretty = g => String(g || '').replace(/_/g, ' ').replace(/;/g, ' · ');

// ---------- sections (the menu) ----------
// Order here is the order in the menu bar. `route` is the hash; `ready:false` sections
// render an honest "coming soon" instead of pretending to have content.
// Inline SVG icons — no external requests, works offline. 24-grid, currentColor stroke.
const ICON = {
  home:    '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  news:    '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>',
  verbs:   '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  grammar: '<path d="M5 4h13a1 1 0 0 1 1 1v15H6a1 1 0 0 1-1-1z"/><path d="M5 17h14"/>',
  stories: '<path d="M12 7c-2-1.4-5-1.4-8 0v12c3-1.4 6-1.4 8 0 2-1.4 5-1.4 8 0V7c-3-1.4-6-1.4-8 0z"/><path d="M12 7v12"/>',
};
const svg = n => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none"
  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const SECTIONS = [
  {route: 'news',    icon: 'news',    label: "Today's News",    ready: true},
  {route: 'verbs',   icon: 'verbs',   label: 'Verbs',           ready: true},
  {route: 'grammar', icon: 'grammar', label: 'Grammar Lessons', ready: false},
  {route: 'stories', icon: 'stories', label: 'Short Stories',   ready: false},
];

function renderNav(active){
  const item = (route, icon, label, ready) =>
    `<button class="navb${route===active?' on':''}" onclick="location.hash='/${route==='home'?'':route}'">
       ${svg(icon)}<span>${esc(label)}</span>${ready===false?'<em>soon</em>':''}</button>`;
  $('nav').innerHTML =
    item('home', 'home', 'Home', true) +
    `<div class="side-sep"></div>` +
    SECTIONS.map(sec => item(sec.route, sec.icon, sec.label, sec.ready)).join('');
}

// ---------- routing (hash so Back works, and it survives a reload) ----------
function route() {
  if (typeof closeSide === 'function') closeSide();
  const h = location.hash.slice(1) || '/';
  const [, kind, id] = h.split('/');
  // A text/drill belongs to whichever section it came from; light that tab when we can.
  if (kind === 'text')  { const t = LIB.texts.find(x => x.id === id);
    if (t) { renderNav(t.kind === 'news' ? 'news' : null); return reader(t); } }
  if (kind === 'drill') { const d = LIB.drills.find(x => x.id === id);
    if (d) { renderNav(null); return drill(d); } }
  if (kind === 'verb') { renderNav('verbs'); return verbDetail(id); }
  const sec = SECTIONS.find(x => x.route === kind);
  if (sec) { renderNav(sec.route);
    if (sec.route === 'news')  return newsSection();
    if (sec.route === 'verbs') return verbsSection(id);
    return emptySection(sec); }
  renderNav('home');
  home();
}
addEventListener('hashchange', route);

// ---------- home ----------
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function home(){
  $('back').hidden = true;
  $('title').textContent = 'Palestinian Arabic';
  const today = todayISO();
  const news = LIB.texts.filter(t => t.kind === 'news')
                        .sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  const fresh = news && news.date === today;

  // Today's news, up top — the one section with live content, and the thing you'd
  // reach for first each morning.
  let h = '<div class="hero">';
  if (fresh) {
    h += `<button class="big" onclick="location.hash='/text/${esc(news.id)}'">
      <div class="k">Today's News</div>
      <div class="t">${esc(news.title.en)}</div>
      <div class="ar">${esc(news.title.ar)}</div>
      <div class="s">${news.sentences.length} sentences, in spoken Palestinian${news._audio ? ' · audio' : ''}</div>
    </button>`;
  } else {
    h += `<button class="big warn" onclick="location.hash='/news'">
      <div class="k">Today's News</div>
      <div class="t">${news ? "Today's isn't in yet" : 'No news yet'}</div>
      <div class="s">${news ? 'Latest is ' + esc(news.date) + '.' : 'Written fresh each morning.'} Tap to browse.</div>
    </button>`;
  }
  h += '</div>';

  // The menu as tiles — mirrors the bar, with a status line per section.
  h += '<div class="sec">Sections</div><div class="tiles">';
  h += SECTIONS.map(sec => {
    const count = sec.route === 'news'
      ? LIB.texts.filter(t => t.kind === 'news').length + ' articles'
      : sec.route === 'verbs' ? VB.length + ' verbs, by form'
      : 'Coming soon';
    return `<button class="tile${sec.ready ? '' : ' soon'}" onclick="location.hash='/${sec.route}'">
      <div class="tile-t">${esc(sec.label)}</div>
      <div class="tile-s">${count}</div></button>`;
  }).join('');
  h += '</div>';

  // Existing practice content that predates the sections. Kept reachable rather than
  // orphaned; morning-coffee could later live under Short Stories.
  const drill = LIB.drills[0];
  const coffee = LIB.texts.find(t => t.kind !== 'news');
  if (drill || coffee) {
    h += '<div class="sec">Practice</div>';
    if (drill) h += card(drill, 'drill');
    if (coffee) h += card(coffee, 'text');
  }

  h += `<div class="note"><b>What this shows is real.</b> Every root, meaning and
    pronunciation comes from Maknuune, a 36,000-entry Palestinian lexicon compiled by
    linguists — not generated. Tap any word and the card tells you exactly where its
    root, gloss and vowels came from.
    <div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--rule);
      font-size:11px;color:var(--muted)">Word data from the <b>Maknuune Palestinian Arabic
      Lexicon</b> (Dibas, Khairallah, Habash et al., WANLP 2022) —
      <a href="https://palestine-lexicon.org/" target="_blank" rel="noopener"
      style="color:var(--verdigris)">palestine-lexicon.org</a>, CC BY-SA 4.0.</div></div>`;
  $('view').innerHTML = h;
}

function newsSection(){
  $('back').hidden = false;
  $('title').textContent = "Today's News";
  const news = LIB.texts.filter(t => t.kind === 'news')
                        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (!news.length) { $('view').innerHTML =
    `<p class="hint">No news yet. It's written fresh each morning by the daily job.</p>`;
    return; }
  const today = todayISO();
  let h = '';
  if (news[0].date !== today)
    h += `<div class="unval"><b>Today's isn't in yet.</b> The morning job writes it around
      5am; until then the latest is ${esc(news[0].date)}.</div>`;
  h += news.map(t => card(t, 'text')).join('');
  $('view').innerHTML = h;
}

// ---------- verbs section ----------
function verbsSection(sub){
  $('back').hidden = false;
  if (sub && FORM_INFO[sub]) return verbsForm(sub);
  if (sub === 'irregular')   return verbsIrregular();
  return verbsHome();
}

// One verb → a card with its root, gloss, badges and the three principal parts. The
// principal parts are the skeleton of the whole paradigm; full conjugations come later.
function verbCard(v){
  const badges = `<span class="b-form">${esc(v.form === 'Q' ? 'Quad' : v.form)}</span>` +
    (WEAK_INFO[v.weak] ? `<span class="b-wk">${esc(WEAK_INFO[v.weak][0].toLowerCase())}</span>` : '') +
    (v.conj ? `<span class="b-cj">conjugates</span>` : '');
  const root = esc((v.root || '').replace(/\./g, ' · '));
  const part = (k, pp) => pp ? `<div class="pp">
      <span class="pp-k">${k}</span>
      <span class="pp-ar">${esc(pp.ar)}</span>
      <span class="pp-c">${esc(pp.caphi)}</span></div>` : '';
  return `<button class="vc" onclick="location.hash='/verb/${v._i}'">
    <div class="vc-h"><span class="vc-gl">${esc(v.gloss || '—')}</span>
      <span class="vc-badges">${badges}</span></div>
    <div class="vc-root">${root}</div>
    <div class="vc-pp">
      ${part('Past', v.past)}${part('Present', v.pres)}${part('Command', v.imp)}</div>
  </button>`;
}

// Person rows, in the reference's order. label = English, ar = the pronoun.
const PERSONS = [
  ['ana','I','أنا'], ['inta','you (m)','إنت'], ['inti','you (f)','إنتي'],
  ['huwwe','he','هو'], ['hiyye','she','هي'], ['i7na','we','إحنا'],
  ['intu','you (pl)','إنتو'], ['humme','they','هم'],
];

function verbDetail(i){
  const v = VB[+i];
  $('back').hidden = false;
  if (!v) { $('title').textContent = 'Verb'; $('view').innerHTML =
      `<p class="hint">That verb isn’t loaded. <a href="#/verbs">Back to verbs</a>.</p>`; return; }
  $('title').textContent = v.gloss ? v.gloss.split(' · ')[0] : 'Verb';
  const badges = `<span class="b-form">${esc(v.form === 'Q' ? 'Quad' : v.form)}</span>` +
    (WEAK_INFO[v.weak] ? `<span class="b-wk">${esc(WEAK_INFO[v.weak][0].toLowerCase())}</span>` : '');
  const root = esc((v.root || '').replace(/\./g, ' · '));

  let h = `<div class="vd-head">
    <div class="vd-ar">${esc(v.past ? v.past.ar : '')}</div>
    <div class="vd-meta"><div class="vd-gl">${esc(v.gloss || '—')}</div>
      <div class="vd-sub">${root} &nbsp;·&nbsp; ${badges}</div></div></div>`;

  const c = v.conj;
  if (!c) {
    h += `<div class="unval" style="border-color:var(--rule);background:var(--paper-2)">
      <b style="color:var(--verdigris)">Principal parts.</b> Full conjugation tables for
      this class are being added in a later wave — verified against the reference before
      they ship. Here are the three parts every form is built from.</div>`;
    const part = (k, pp) => pp ? `<div class="pp"><span class="pp-k">${k}</span>
        <span class="pp-ar">${esc(pp.ar)}</span><span class="pp-c">${esc(pp.caphi)}</span></div>` : '';
    h += `<div class="vc-pp" style="max-width:420px">
        ${part('Past', v.past)}${part('Present', v.pres)}${part('Command', v.imp)}</div>`;
    $('view').innerHTML = h;
    return;
  }

  // three tenses side by side, one row per person
  const cell = k => c[k] ? `<div class="cj-cell"><span class="cj-ar">${esc(c[k].ar)}</span>
      <span class="cj-ph">${esc(c[k].ph)}</span></div>` : `<div class="cj-cell">—</div>`;
  h += `<div class="cj-tbl">
    <div class="cj-row cj-hdr"><div class="cj-pr"></div>
      <div>Past</div><div>Present</div><div>Present + بـ</div></div>`;
  PERSONS.forEach(([key,en,ar]) => {
    h += `<div class="cj-row"><div class="cj-pr"><span class="cj-pr-ar">${esc(ar)}</span>
        <span class="cj-pr-en">${esc(en)}</span></div>
      ${cell('perf|'+key)}${cell('impf|'+key)}${cell('bimpf|'+key)}</div>`;
  });
  h += `</div>`;

  // imperative + participle
  const mini = (title, rows) => `<div class="cj-mini"><div class="sec">${title}</div>
    <div class="cj-mini-row">${rows.map(([lbl,k]) => c[k] ?
      `<div class="cj-cell"><span class="cj-k">${esc(lbl)}</span>
        <span class="cj-ar">${esc(c[k].ar)}</span><span class="cj-ph">${esc(c[k].ph)}</span></div>` : ''
    ).join('')}</div></div>`;
  h += mini('Command (imperative)', [['you (m)','imp|inta'],['you (f)','imp|inti'],['you (pl)','imp|intu']]);
  h += mini('Active participle (doing / having done)',
        [['m','ap|m'],['f','ap|f'],['pl','ap|p']]);

  const cls = (WEAK_INFO[v.weak] ? WEAK_INFO[v.weak][0].toLowerCase() + ' ' : '') + 'Form ' + v.form;
  h += `<div class="note">Conjugations are <b>derived by rule</b> from this verb’s principal
    parts, then verified against <i>Palestinian Arabic Verbs</i> (Aldrich, Lingualism): the
    engine reproduces 99%+ of the book’s ${esc(cls)} cells, the rest being optional vowel
    reductions that vary in everyday speech. Arabic is shown unvocalized, the way it’s written.</div>`;
  $('view').innerHTML = h;
}

function verbsHome(){
  $('title').textContent = 'Verbs';
  let h = `<p class="hint">Arabic verbs are built on three- or four-letter roots, run
    through a set of patterns called <b>forms</b> (measures I–X). The form shapes the
    meaning; the root supplies it. Browse by form below, or search across all
    ${VB.length} verbs. Every root, gloss and pronunciation is from the Maknuune
    lexicon — the form is computed, the conjugations are not invented.</p>`;

  h += `<input id="vsearch" class="vsearch" type="search" inputmode="search"
    placeholder="Search ${VB.length} verbs — English, root or Arabic…"
    oninput="verbSearch(this.value)" aria-label="Search verbs">
    <div id="vsearchout"></div>`;

  h += '<div class="sec">Forms</div><div class="vtiles">';
  h += FORM_ORDER.map(f => {
    const n = byForm(f).length; if (!n) return '';
    const [label, desc] = FORM_INFO[f];
    return `<button class="vtile" onclick="location.hash='/verbs/${f}'">
      <div class="vtile-h"><span class="vtile-t">${esc(label)}</span>
        <span class="vtile-n">${n}</span></div>
      <div class="vtile-s">${esc(desc)}</div></button>`;
  }).join('');
  h += '</div>';

  h += `<div class="sec">Cross-cutting</div>
    <button class="vtile wide" onclick="location.hash='/verbs/irregular'">
      <div class="vtile-h"><span class="vtile-t">Irregular / weak verbs</span>
        <span class="vtile-n">${irregular.length}</span></div>
      <div class="vtile-s">Verbs whose root has a و, ي or ء that shifts or drops —
        grouped by how they bend. These exist inside every form.</div></button>`;
  $('view').innerHTML = h;
}

// Live search across all verbs. Kept simple: substring over gloss, root and Arabic.
function verbSearch(q){
  const out = $('vsearchout'); if (!out) return;
  q = (q || '').trim().toLowerCase();
  if (q.length < 2) { out.innerHTML = ''; return; }
  // Score so the verb you meant floats up: an exact gloss sense beats a word that merely
  // starts with q, which beats a bare substring ("eat" shouldn't rank "seat" first).
  const wordRe = new RegExp('(^|[\\s·])' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const score = v => {
    const g = (v.gloss || '').toLowerCase();
    if (g.split(' · ').includes(q)) return 0;          // exact sense
    if (wordRe.test(g))             return 1;          // a sense word starts with q
    if (g.includes(q))              return 2;          // gloss substring
    if ((v.root || '').includes(q)) return 3;          // root
    if ([v.past, v.pres, v.imp].some(p => p && (p.ar.includes(q) || p.caphi.toLowerCase().includes(q))))
      return 4;                                        // arabic / pronunciation
    return 99;
  };
  const hits = VB.map(v => [score(v), v]).filter(x => x[0] < 99)
    .sort((a, b) => a[0] - b[0]).map(x => x[1]).slice(0, 60);
  out.innerHTML = hits.length
    ? `<div class="sec">${hits.length}${hits.length === 60 ? '+' : ''} match${hits.length===1?'':'es'}</div>` +
      `<div class="vlist">${hits.map(verbCard).join('')}</div>`
    : `<p class="hint">No verb matches “${esc(q)}”.</p>`;
}

function verbsForm(f){
  const [label, desc] = FORM_INFO[f];
  $('title').textContent = label;
  const list = byForm(f);
  let h = `<div class="unval" style="border-color:var(--rule);background:var(--paper-2)">
    <b style="color:var(--verdigris)">${esc(label)}.</b> ${esc(desc)}</div>`;
  h += `<div class="sec">${list.length} verbs</div>`;
  h += `<div class="vlist">${list.map(verbCard).join('')}</div>`;
  $('view').innerHTML = h;
}

function verbsIrregular(){
  $('title').textContent = 'Irregular verbs';
  let h = `<p class="hint">Weak verbs carry a و, ي or ء in the root that shifts or
    disappears when conjugated. They cut across all the forms. Grouped here by the kind
    of weakness so the patterns sit side by side.</p>`;
  WEAK_ORDER.forEach(w => {
    const list = irregular.filter(v => v.weak === w); if (!list.length) return;
    const [label, desc] = WEAK_INFO[w];
    h += `<div class="sec">${esc(label)} · ${list.length}</div>
      <p class="hint" style="margin-bottom:12px">${esc(desc)}</p>
      <div class="vlist">${list.map(verbCard).join('')}</div>`;
  });
  $('view').innerHTML = h;
}

// An honest placeholder for a section with no content yet.
function emptySection(sec){
  $('back').hidden = false;
  $('title').textContent = sec.label;
  $('view').innerHTML =
    `<div class="empty">
       <div class="empty-t">${esc(sec.label)}</div>
       <p>Nothing here yet — this section is being built.</p>
     </div>`;
}

function card(t, kind){
  const isDrill = kind === 'drill';
  const n = isDrill ? 0 : t.sentences.reduce((a,s) =>
    a + s.words.filter(w => w.lemma && marked.has(w.lemma)).length, 0);
  return `<button class="card" onclick="location.hash='/${kind}/${esc(t.id)}'">
    ${!isDrill && t.title.ar ? `<div class="ar">${esc(t.title.ar)}</div>` : ''}
    <div class="en">${esc(t.title.en)}</div>
    <div class="meta">
      <span>${isDrill ? t.items.length+' chunks' : t._words+' words'}</span>
      ${n ? `<span style="color:var(--ochre)">${n} marked</span>` : ''}
      ${t.kind === 'news' ? '<span class="pill">news</span>' : ''}
      <span class="pill ${t._audio ? 'on' : 'off'}">${t._audio ? 'audio' : 'no audio'}</span>
    </div></button>`;
}

// ---------- reader ----------
let cur = null;
function reader(t) {
  cur = t;
  $('back').hidden = false;
  $('title').textContent = t.title.en;
  let h = `<div class="ctl">
      <button class="tog" id="tVoc" aria-pressed="true">Vowels</button>
      <button class="tog" id="tEn" aria-pressed="false">English</button>
      <button class="tog" id="tMk" aria-pressed="true">Show marked</button>
    </div>` +
    (/not native-validated/i.test(t.source || '')
      ? `<div class="unval"><b>Not checked by a native speaker.</b> Every word's root,
         meaning and vowels come from the lexicon — but the <i>sentences</i> were written
         by Claude. Fine for reading practice; don't memorise the phrasing yet.</div>`
      : '') +
    `<div class="rd" id="rd" data-en="off" data-voc="on">`;
  t.sentences.forEach((s, si) => {
    h += '<div class="sent"><div class="ar">';
    s.words.forEach((w, wi) => {
      const gap = !w.lemma;
      // Both spellings ship; the toggle swaps which is shown. A word we could not
      // vocalize honestly falls back to its plain spelling and says so in the card.
      const voc = w.vocalized || w.surface;
      h += `<span class="w${gap ? ' gap' : ''}${w.vocalized ? '' : ' novoc'}"
              data-s="${si}" data-w="${wi}" tabindex="0"
             ><span class="v">${esc(voc)}</span><span class="p">${esc(w.surface)}</span></span> `;
    });
    h += `</div><p class="en">${esc(s.en)}</p>`;
    h += player(s.audio);
    h += `<button class="peek" data-peek="${si}">Peek at English</button></div>`;
  });
  $('view').innerHTML = h + '</div>';
  paint();

  $('tVoc').onclick = e => {
    const on = e.target.getAttribute('aria-pressed') !== 'true';
    e.target.setAttribute('aria-pressed', String(on));
    $('rd').dataset.voc = on ? 'on' : 'off';
  };
  $('tEn').onclick = e => {
    const on = e.target.getAttribute('aria-pressed') !== 'true';
    e.target.setAttribute('aria-pressed', String(on));
    $('rd').dataset.en = on ? 'on' : 'off';
  };
  $('tMk').onclick = e => {
    const on = e.target.getAttribute('aria-pressed') !== 'true';
    e.target.setAttribute('aria-pressed', String(on));
    $('rd').dataset.mk = on ? 'on' : 'off';
    paint();
  };
}

function paint() {
  const showMk = $('rd') && $('rd').dataset.mk !== 'off';
  document.querySelectorAll('#rd .w').forEach(el => {
    const w = cur.sentences[+el.dataset.s].words[+el.dataset.w];
    el.classList.toggle('mk', showMk && !!w.lemma && marked.has(w.lemma));
  });
  count();
}

// ---------- word card ----------
function showCard(si, wi) {
  const w = cur.sentences[si].words[wi];
  const on = w.lemma && marked.has(w.lemma);
  const CUR = {'curated:function-word':'hand-curated · common function word',
               'curated:proper-noun'  :'hand-curated · name, no lexicon has these',
               'curated:modern-term'  :'hand-curated · too new for the lexicon'};
  const src = w.maknuune_id ? `Maknuune #${esc(w.maknuune_id)}`
            : CUR[w.provenance] || ((w.provenance||'').startsWith('curated')
              ? 'hand-curated' : 'not in the lexicon — unverified');
  $('wc').innerHTML =
    `<div class="hw">${esc(w.vocalized || w.surface)}</div>
     <div class="ph">${esc(w.caphi_urban || w.caphi || '')}</div>
     <div class="gl">${esc(pretty(w.gloss)) || '<span style="color:var(--muted)">no entry</span>'}</div>
     <dl>
       <dt>As written</dt><dd class="rtl">${esc(w.surface)}</dd>
       <dt>Vowels</dt><dd>${esc(VOCSRC[w.vocalized_from] || w.vocalized_from || '—')}</dd>
       <dt>Dictionary</dt><dd class="rtl">${esc(w.form || '—')}</dd>
       <dt>Root</dt><dd class="rtl">${esc(w.root || '—')}</dd>
       <dt>Type</dt><dd>${esc(w.analysis || '—')}</dd>
     </dl>
     <div class="src">${src}</div>
     <div class="acts">
       <button data-a="close">Close</button>
       <button class="mk" data-a="mark" data-on="${on ? 1 : 0}" ${w.lemma ? '' : 'disabled'}>
         ${on ? '✓ Learning this' : "+ Don't know it"}</button>
     </div>`;
  $('cw').classList.add('on');
  $('wc').querySelector('[data-a="close"]').onclick = hideCard;
  const mk = $('wc').querySelector('[data-a="mark"]');
  if (w.lemma) mk.onclick = () => {
    marked.has(w.lemma) ? marked.delete(w.lemma)
                        : marked.set(w.lemma, {gloss: w.gloss, root: w.root,
                                               caphi: w.caphi_urban || w.caphi,
                                               surface: w.surface, text: cur.id});
    save(); paint(); showCard(si, wi);
  };
}
const hideCard = () => $('cw').classList.remove('on');
$('scrim').onclick = hideCard;
addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });

// ---------- drill ----------
function drill(d) {
  $('back').hidden = false;
  $('title').textContent = d.title.en;
  let h = `<p class="hint">Read the English, <b>say it out loud</b>, then tap to check.
    The saying-it-first part is what makes it work — checking before you try is the
    one way to get nothing out of this.</p>`;
  d.items.forEach((it, i) => {
    h += `<div class="ch"><div class="q">${esc(it.cue)}</div>
      <div class="a" tabindex="0">${esc(it.answer)}</div>` +
      (it.answer_audio
        ? player(it.answer_audio)
        : '') +
      `<div class="u">${esc(it.use || '')}</div></div>`;
  });
  $('view').innerHTML = h;
}

// ---------- tray ----------
function count() { $('cnt').textContent = marked.size; $('exp').disabled = !marked.size;
                   $('rev').disabled = !marked.size; }
// Return to wherever you came from (the section list, home, etc.) rather than
// always jumping home. Falls back to home if there's no in-app history.
$('back').onclick = () => { if (history.length > 1) history.back(); else location.hash = '/'; };

// ---------- sidebar drawer ----------
function openSide(){ $('sidebar').classList.add('open'); $('sideScrim').hidden = false;
  $('ham').setAttribute('aria-expanded','true'); $('sidebar').setAttribute('aria-hidden','false'); }
function closeSide(){ $('sidebar').classList.remove('open'); $('sideScrim').hidden = true;
  $('ham').setAttribute('aria-expanded','false'); $('sidebar').setAttribute('aria-hidden','true'); }
$('ham').onclick = () => $('sidebar').classList.contains('open') ? closeSide() : openSide();
$('sideScrim').onclick = closeSide;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSide(); });
$('rev').onclick = () => {
  if (!marked.size) return;
  $('back').hidden = false; $('title').textContent = 'Words to learn';
  $('view').innerHTML = '<div class="sec">Marked</div>' + [...marked].map(([l, m]) =>
    `<div class="ch"><div class="a show" style="filter:none">${esc(l)}</div>
      <div class="q" style="font-size:15px">${esc(pretty(m.gloss))}</div>
      <div class="u">${esc(m.caphi || '')} &nbsp;·&nbsp; root ${esc(m.root || '—')}</div></div>`).join('');
};
$('exp').onclick = () => {
  // Tab-separated: what Anki's importer expects. Front / Back / Pronunciation / Root.
  const rows = [...marked].map(([l, m]) =>
    [l, pretty(m.gloss), m.caphi || '', m.root || ''].join('\t')).join('\n');
  navigator.clipboard.writeText(rows).then(() => {
    $('exp').textContent = '✓ Copied';
    setTimeout(() => $('exp').textContent = 'Export', 1600);
  }).catch(() => {
    $('view').innerHTML = '<div class="sec">Copy this into Anki</div><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:12px;border:1px solid var(--rule);padding:12px;border-radius:5px">' + esc(rows) + '</pre>';
  });
};

// Single delegated click handler for the whole app. Attached ONCE — a per-render
// listener on the reused #view element stacked with every navigation and played each
// clip multiple times (the echo). Every branch below keys off a distinct class, so one
// handler serves reader, drill, and word cards alike.
$('view').addEventListener('click', e => {
  const pp = e.target.closest('.player .pp');
  if (pp) { toggleSrc(pp.closest('.player')); return; }   // play / pause
  const sb = e.target.closest('.pspd .sb');
  if (sb) { applySpeed(parseFloat(sb.dataset.spd), sb.closest('.player')); return; }
  const pk = e.target.closest('[data-peek]');
  if (pk) { pk.closest('.sent').classList.add('peek'); return; }
  const w = e.target.closest('.rd .w');
  if (w) { showCard(+w.dataset.s, +w.dataset.w); return; }
  const a = e.target.closest('.ch .a');
  if (a) { a.classList.toggle('show'); return; }
});
$('view').addEventListener('input', e => {
  const sk = e.target.closest('.player .seek');
  if (sk) seekTo(sk.closest('.player'), parseFloat(sk.value));
});

count();
route();
</script>
</body>
</html>
