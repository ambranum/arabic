<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestinian">
<meta name="theme-color" content="#EDEDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Palestinian Arabic</title>
<style>
  :root{
    --paper:#EDEDE6; --paper-2:#E4E4DB; --paper-3:#DADAD0;
    --ink:#15161A; --ink-soft:#4A4B52; --muted:#7A7A72; --rule:#C9C9BE;
    --rubric:#B4372A; --verdigris:#2F6B63; --verdigris-2:#E0EAE7;
    --ochre:#C8912F; --ochre-wash:rgba(200,145,47,.17);
    --serif:"Iowan Old Style","Charter",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --arabic:"Geeza Pro","SF Arabic","Damascus","Al Bayan",serif;
    --tray:60px;
    /* App content width. Was a fixed 760px column that left most of a desktop empty; now
       fills the screen up to a cap so reading lines don't stretch on ultra-wide monitors.
       On phones 96vw is effectively full width, so mobile is unchanged. The header, the
       content, and the bottom tray all read from this so they stay aligned. */
    --maxw:min(96vw, 1240px);
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#16171B; --paper-2:#1E1F24; --paper-3:#292A30;
    --ink:#E4E3DC; --ink-soft:#A9A9A2; --muted:#82827B; --rule:#33343B;
    --rubric:#FF7B62; --verdigris:#63B3A5; --verdigris-2:#1C2E2C;
    --ochre:#D9A94D; --ochre-wash:rgba(217,169,77,.15);}}
  :root[data-theme="dark"]{
    --paper:#16171B; --paper-2:#1E1F24; --paper-3:#292A30;
    --ink:#E4E3DC; --ink-soft:#A9A9A2; --muted:#82827B; --rule:#33343B;
    --rubric:#FF7B62; --verdigris:#63B3A5; --verdigris-2:#1C2E2C;
    --ochre:#D9A94D; --ochre-wash:rgba(217,169,77,.15);}
  :root[data-theme="light"]{
    --paper:#EDEDE6; --paper-2:#E4E4DB; --paper-3:#DADAD0;
    --ink:#15161A; --ink-soft:#4A4B52; --muted:#7A7A72; --rule:#C9C9BE;
    --rubric:#B4372A; --verdigris:#2F6B63; --verdigris-2:#E0EAE7;
    --ochre:#C8912F; --ochre-wash:rgba(200,145,47,.17);}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans);
       -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
  .wrap{max-width:var(--maxw); margin:0 auto;
        padding:20px 18px calc(var(--tray) + 34px + var(--kbdh, 0px))}

  /* ---------- chrome ---------- */
  .top{display:flex; align-items:baseline; gap:12px; padding-bottom:14px;
       border-bottom:1px solid var(--rule); margin-bottom:20px}
  .top h1{font-family:var(--serif); font-size:20px; font-weight:400; margin:0;
          letter-spacing:-.01em}
  .top .sp{flex:1}
  .back{font:inherit; font-size:13px; color:var(--verdigris); background:none;
        border:none; padding:6px 0; cursor:pointer}
  .back:hover{text-decoration:underline}

  /* ---------- hamburger + sidebar drawer ---------- */
  .ham{flex:none; width:36px; height:36px; margin:-4px 4px -4px -6px; padding:0; cursor:pointer;
       display:inline-flex; align-items:center; justify-content:center; border:none;
       border-radius:8px; background:none; color:var(--ink)}
  .ham:hover{background:var(--paper-2)}
  .ham:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}

  /* classic dark sidebar, always dark for that contrast against the page */
  .sidebar{position:fixed; top:0; left:0; bottom:0; z-index:80; width:264px; max-width:84vw;
           background:#181a22; color:#d7dae2; transform:translateX(-100%);
           transition:transform .22s ease; display:flex; flex-direction:column;
           padding:18px 12px calc(18px + env(safe-area-inset-bottom));
           overflow-y:auto; box-shadow:2px 0 24px rgba(0,0,0,.28)}
  .sidebar.open{transform:none}
  .side-brand{display:flex; flex-direction:column; gap:2px; padding:6px 12px 16px;
      font-family:var(--arabic); font-size:26px; direction:rtl; color:#fff; line-height:1}
  .side-brand span{font-family:var(--serif); font-size:13px; direction:ltr; color:#8b90a0}
  .side-sep{height:1px; background:rgba(255,255,255,.09); margin:8px 10px}
  .side-group{font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:700;
    color:#7c818f; padding:14px 14px 5px}

  #nav{display:flex; flex-direction:column; gap:3px}
  .navb{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
        font:inherit; font-size:14.5px; cursor:pointer; padding:11px 12px; border:none;
        border-radius:9px; background:none; color:#aeb2c0}
  .navb svg{flex:none; opacity:.85}
  .navb:hover{background:rgba(255,255,255,.06); color:#fff}
  .navb.on{background:var(--verdigris); color:#fff; font-weight:600}
  .navb.on svg{opacity:1}
  .navb em{margin-left:auto; font-style:normal; font-size:9.5px; letter-spacing:.06em;
           text-transform:uppercase; color:var(--ochre); opacity:.9}
  .navb:focus-visible{outline:2px solid var(--verdigris); outline-offset:-2px}

  .side-scrim{position:fixed; inset:0; z-index:75; background:rgba(0,0,0,.4)}

  /* section tiles on the home page */
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-bottom:6px}
  /* Single-column reading prose stays at a comfortable measure inside the wide shell. */
  .reading{max-width:880px; margin:0 auto}
  .gbody{max-width:760px}
  .tile{text-align:left; font:inherit; cursor:pointer; border:1px solid var(--rule);
        background:none; color:var(--ink); border-radius:7px; padding:16px}
  .tile:hover{border-color:var(--verdigris)}
  .tile:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .tile-t{font-family:var(--serif); font-size:17px; line-height:1.2}
  .tile-s{font-size:12px; color:var(--muted); margin-top:6px}
  .tile.soon{opacity:.62}
  .tile.soon .tile-s{color:var(--ochre)}

  /* empty section placeholder */
  .empty{text-align:center; padding:56px 20px; color:var(--muted)}
  .empty-t{font-family:var(--serif); font-size:22px; color:var(--ink-soft); margin-bottom:8px}
  .empty p{font-size:14px; line-height:1.6; margin:0}

  /* ---------- home ---------- */
  .hero{display:grid; gap:12px; margin:4px 0 26px}
  .big{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
       border:1px solid var(--rule); background:none; color:var(--ink);
       border-radius:8px; padding:20px; position:relative}
  .big:hover{border-color:var(--verdigris); background:var(--verdigris-2)}
  .big:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .big .k{font-size:10px; letter-spacing:.13em; text-transform:uppercase;
          color:var(--verdigris); font-weight:700}
  .big .t{font-family:var(--serif); font-size:23px; margin-top:5px; line-height:1.25}
  .big .s{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5}
  .big.warn{border-color:var(--ochre)}
  .big.warn .k{color:var(--ochre)}
  .big .ar{font-family:var(--arabic); direction:rtl; font-size:21px; margin-top:6px;
           color:var(--ink-soft)}
  .cmd{font-family:var(--mono); font-size:11.5px; background:var(--paper-2);
       border:1px solid var(--rule); border-radius:4px; padding:9px 11px; margin-top:10px;
       overflow-x:auto; white-space:pre; color:var(--ink-soft)}

  /* ---------- library ---------- */
  .sec{font-size:10px; letter-spacing:.13em; text-transform:uppercase;
       color:var(--muted); font-weight:700; margin:26px 0 10px}
  .card{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
        border:1px solid var(--rule); background:none; color:var(--ink);
        border-radius:6px; padding:15px 16px; margin-bottom:10px}
  .card:hover{border-color:var(--verdigris)}
  .card:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .card .ar{font-family:var(--arabic); direction:rtl; font-size:24px; line-height:1.7}
  .card .en{font-family:var(--serif); font-size:16px; margin-top:1px}
  .card .meta{font-size:11.5px; color:var(--muted); margin-top:7px;
              display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .pill{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em;
        text-transform:uppercase; border:1px solid var(--rule); border-radius:2px;
        padding:2px 6px; color:var(--muted)}
  .pill.on{border-color:var(--verdigris); color:var(--verdigris)}
  .pill.off{opacity:.55}

  /* ---------- reader ---------- */
  .ctl{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
  .tog{font:inherit; font-size:12.5px; padding:6px 12px; border:1px solid var(--rule);
       background:none; color:var(--ink-soft); border-radius:14px; cursor:pointer}
  .tog[aria-pressed="true"]{background:var(--verdigris); border-color:var(--verdigris);
       color:var(--paper); font-weight:500}
  .tog:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}

  .unval{font-size:12px; line-height:1.55; color:var(--ink-soft); border:1px solid var(--ochre);
         background:var(--ochre-wash); border-radius:5px; padding:10px 12px; margin-bottom:18px}
  .unval b{color:var(--ochre)}
  .sent{padding:15px 0; border-bottom:1px solid var(--rule)}
  .sent:last-child{border-bottom:none}
  .ar{font-family:var(--arabic); direction:rtl; text-align:right;
      font-size:31px; line-height:2.1; color:var(--ink)}
  /* Own line-height: an inline-block inherits the 2.1 leading and the highlight
     becomes a tall block instead of hugging the word. */
  .w{display:inline-block; cursor:pointer; padding:2px 3px; border-radius:3px;
     line-height:1.3}
  .w:hover{background:var(--verdigris-2)}
  .w:focus-visible{outline:2px solid var(--verdigris); outline-offset:1px}
  .w.mk{background:var(--ochre-wash); box-shadow:inset 0 -2px 0 var(--ochre)}
  .w.sel{background:var(--verdigris); color:var(--paper)}
  .w.gap{border-bottom:1px dotted var(--muted)}
  /* Vowels toggle: both spellings are in the DOM, CSS picks one. */
  .w .v{display:none}
  .rd[data-voc="on"] .w .v{display:inline}
  .rd[data-voc="on"] .w .p{display:none}
  /* Vowel marks sit above the line, so they need more leading to clear the row above. */
  .rd[data-voc="on"] .ar{line-height:2.4}

  /* Scoped to .rd — an unscoped .en also matched the library card titles and hid them. */
  .rd .en{display:none; font-family:var(--serif); font-size:16px; line-height:1.55;
      font-style:italic; color:var(--ink-soft); margin-top:11px; padding-left:12px;
      border-left:2px solid var(--rule)}
  .rd[data-en="on"] .en{display:block}
  .sent.peek .en{display:block}
  .peek{font:inherit; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
        color:var(--muted); background:none; border:none; padding:7px 0 0 14px; cursor:pointer}
  .rd[data-en="on"] .peek{display:none}
  /* ---------- inline audio player (one per line) ---------- */
  .noaud{display:inline-block; font-size:12px; color:var(--muted); font-style:italic; margin-top:9px}
  .player{display:flex; align-items:center; gap:9px; margin-top:11px; flex-wrap:wrap;
          direction:ltr}
  .player .pp{flex:none; width:32px; height:32px; border-radius:50%; cursor:pointer;
      border:1px solid var(--verdigris); background:var(--verdigris); color:var(--paper);
      display:inline-flex; align-items:center; justify-content:center; padding:0}
  .player .pp::before{content:""; width:0; height:0; margin-left:2px;
      border-left:9px solid currentColor; border-top:6px solid transparent;
      border-bottom:6px solid transparent}                 /* ▶ triangle */
  .player.playing .pp::before{content:""; margin:0; width:8px; height:10px; border:none;
      border-left:3px solid currentColor; border-right:3px solid currentColor}  /* ❚❚ */
  .player .pp:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .player .t-cur, .player .t-dur{font-family:var(--mono); font-size:10.5px; color:var(--muted);
      font-variant-numeric:tabular-nums; min-width:26px; text-align:center}

  /* the scrubber — a range input styled as a filled progress bar */
  .player .seek{flex:1 1 90px; min-width:90px; height:20px; -webkit-appearance:none;
      appearance:none; background:none; cursor:pointer; margin:0}
  .player .seek::-webkit-slider-runnable-track{height:5px; border-radius:3px;
      background:linear-gradient(to right, var(--verdigris) var(--fill,0%), var(--paper-3) var(--fill,0%))}
  .player .seek::-moz-range-track{height:5px; border-radius:3px; background:var(--paper-3)}
  .player .seek::-moz-range-progress{height:5px; border-radius:3px; background:var(--verdigris)}
  .player .seek::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px;
      border-radius:50%; background:var(--verdigris); margin-top:-4.5px;
      box-shadow:0 0 0 3px var(--paper)}
  .player .seek::-moz-range-thumb{width:14px; height:14px; border:none; border-radius:50%;
      background:var(--verdigris); box-shadow:0 0 0 3px var(--paper)}
  .player .seek:focus-visible{outline:none}
  .player .seek:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--verdigris)}

  .pspd{display:inline-flex; border:1px solid var(--rule); border-radius:13px; overflow:hidden}
  /* Four rungs now, so the padding is trimmed to keep the group on one line next to the
     seek bar on a phone. */
  .pspd .sb{font:inherit; font-size:11px; padding:4px 7px; border:none; cursor:pointer;
      border-left:1px solid var(--rule); background:none; color:var(--ink-soft);
      font-variant-numeric:tabular-nums; white-space:nowrap}
  .pspd .sb:first-child{border-left:none}
  .pspd .sb[aria-pressed="true"]{background:var(--verdigris); color:var(--paper); font-weight:600}
  .pspd .sb:focus-visible{outline:2px solid var(--verdigris); outline-offset:-2px}
  /* On a phone the fourth speed pushed the group past the row and the whole player wrapped
     onto two lines — doubling the height of every player in a story. Tighten the buttons and
     let the seek bar give up some width instead, so it stays one line down to ~320px. */
  @media(max-width:430px){
    .pspd .sb{padding:4px 5px; font-size:10px}
    .player{gap:7px}
    .player .seek{min-width:64px; flex:1 1 64px}
  }
  /* Below ~360px there isn't room for both. The elapsed/duration numbers go rather than the
     speed control: the seek bar already shows position, and these clips are a few seconds. */
  @media(max-width:360px){ .player .t-cur, .player .t-dur{display:none} }

  /* ---------- word card: bottom sheet on phone, popover on desktop ---------- */
  .cardwrap{position:fixed; inset:0; z-index:60; display:none}
  .cardwrap.on{display:block}
  .scrim{position:absolute; inset:0; background:rgba(0,0,0,.28)}
  .wc{position:absolute; left:0; right:0; bottom:0; background:var(--paper);
      border-top:1px solid var(--rule); border-radius:12px 12px 0 0;
      padding:18px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow:0 -8px 30px rgba(0,0,0,.2); max-height:78vh; overflow-y:auto}
  @media(min-width:620px){
    .scrim{background:transparent}
    .wc{left:50%; right:auto; bottom:auto; transform:translateX(-50%);
        top:12vh; width:340px; border:1px solid var(--rule); border-radius:7px;
        box-shadow:0 16px 44px rgba(0,0,0,.22); padding:18px}
  }
  .wc .hw{font-family:var(--arabic); direction:rtl; font-size:32px; line-height:1.6}
  .wc .ph{font-family:var(--mono); font-size:13px; color:var(--verdigris); margin-top:2px}
  /* Pimsleur progress card */
  .pimc{margin-top:18px; padding:13px 15px; border:1px solid var(--rule); border-radius:11px}
  .pimc-t{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
  .pimc-now{font-size:19px; margin-top:3px}
  .pimc-bar{height:5px; border-radius:3px; background:var(--paper-3); margin-top:9px; overflow:hidden}
  .pimc-bar i{display:block; height:100%; background:var(--verdigris)}
  .pimc-sub{font-size:12px; color:var(--muted); margin-top:6px}
  /* phrase capture */
  .rd .w.phsel{background:var(--verdigris); color:var(--paper); border-radius:4px}
  .phbar{position:fixed; left:0; right:0; bottom:0; z-index:70; display:none;
    align-items:center; justify-content:center; gap:12px; padding:12px 16px;
    background:var(--verdigris); color:var(--paper); font-size:14px}
  .phbar.on{display:flex}
  .phbar button{font:inherit; font-size:13px; padding:5px 12px; cursor:pointer;
    border:1px solid var(--paper); border-radius:99px; background:transparent; color:var(--paper)}
  .phw{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px}
  .phw span{font-size:11.5px; color:var(--muted); border:1px solid var(--rule);
    border-radius:7px; padding:4px 8px; text-align:center}
  .phw b{display:block; font-size:15px; color:var(--ink); font-weight:400}
  .phlab{display:block; margin-top:14px; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); text-align:left}
  .phlab input{display:block; width:100%; margin-top:5px; font:inherit; font-size:15px;
    text-transform:none; letter-spacing:0; padding:8px 10px; border-radius:8px;
    border:1px solid var(--rule); background:var(--bg); color:var(--ink)}
  .phlab input:focus{outline:2px solid var(--verdigris); outline-offset:1px}
  .phlab input.phbad{border-color:var(--rubric); outline:2px solid var(--rubric)}
  /* where the meaning comes from */
  .phsug{margin-top:12px; text-align:left}
  .phsug-t{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
    margin-bottom:5px}
  .phsug-b{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
    margin-bottom:5px; padding:7px 10px; border-radius:8px; border:1px solid var(--rule);
    background:transparent; color:var(--ink)}
  .phsug-b:hover{border-color:var(--verdigris)}
  .phsug-en{display:block; font-size:14px}
  .phsug-w{display:block; font-size:10.5px; color:var(--muted); margin-top:2px}
  .phsug-ctx{font-size:16px; line-height:1.7}
  .phsug-en2{font-size:13px; color:var(--ink-soft); margin-top:2px}
  .phwrap{margin-top:12px; text-align:left}
  .rv-front.rv-phrase{font-size:26px; line-height:1.6}
  .vcc-ph{font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--verdigris);
    border:1px solid var(--verdigris); border-radius:99px; padding:1px 7px; margin-inline-start:6px}
  .wc .phwa{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:1px}
  .wc .phwa b{font-weight:600; font-size:9px; letter-spacing:.08em; text-transform:uppercase;
              margin-right:6px; opacity:.85}
  .wc .wtype{display:inline-block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    font-weight:700; color:var(--ochre); border:1px solid var(--ochre); border-radius:4px;
    padding:2px 7px; margin-top:8px}
  .wcj{border:1px solid var(--rule); border-radius:8px; margin:12px 0 4px; overflow:hidden}
  .wcj-h{display:flex; justify-content:space-between; align-items:baseline; padding:8px 10px;
    background:var(--paper-2); font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted); font-weight:700}
  .wcj-h a{color:var(--verdigris); text-transform:none; letter-spacing:0; font-weight:600}
  .wcj-tbl{padding:4px 8px 8px}
  .wcj-row{display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr; gap:6px; align-items:center; padding:4px 2px; border-bottom:1px solid var(--rule)}
  .wcj-row:last-child{border-bottom:none}
  .wcj-hdr{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  .wcj-hdr span{padding:0}
  .wcj-pr{font-family:var(--arabic); direction:rtl; font-size:15px}
  .wcj-pr em{display:block; font-family:var(--sans); font-style:normal; font-size:9.5px; color:var(--muted)}
  .wcj-c{display:flex; flex-direction:column; line-height:1.15}
  .wcj-ar{font-family:var(--arabic); direction:rtl; font-size:16px}
  .wcj-ph{font-family:var(--mono); font-size:9.5px; color:var(--verdigris)}
  .wc .gl{font-family:var(--serif); font-size:18px; margin:10px 0 14px; line-height:1.4}
  .wc dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 14px;
         padding-top:12px; border-top:1px solid var(--rule); font-size:13.5px}
  .wc dt{color:var(--muted); font-size:10px; letter-spacing:.08em;
         text-transform:uppercase; padding-top:3px}
  .wc dd{margin:0}
  .wc dd.rtl{font-family:var(--arabic); direction:rtl; text-align:left; font-size:19px}
  .wc .src{font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:12px}
  .wc .acts{display:flex; gap:8px}
  .wc .acts button{flex:1; font:inherit; font-size:14px; padding:11px;
      border:1px solid var(--rule); background:none; color:var(--ink-soft);
      border-radius:5px; cursor:pointer}
  .wc .acts button.mk[data-on="1"]{border-color:var(--ochre); color:var(--ochre);
      background:var(--ochre-wash); font-weight:600}
  .wc .acts button:disabled{opacity:.35; cursor:default}

  /* ---------- drill ---------- */
  .ch{border:1px solid var(--rule); border-radius:6px; padding:14px 16px; margin-bottom:9px}
  .ch .q{font-family:var(--serif); font-size:17px}
  .ch .a{font-family:var(--arabic); direction:rtl; text-align:right; font-size:27px;
         line-height:1.8; margin-top:6px; filter:blur(7px); cursor:pointer;
         transition:filter .12s}
  .ch .a.show{filter:none}
  .ch .u{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.45}
  /* Reactions */
  .rx-card{border:1px solid var(--rule); border-radius:9px; padding:13px 15px; margin-bottom:9px}
  .rx-card.got{border-color:var(--verdigris); background:var(--paper-2)}
  .rx-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .rx-ar{font-family:var(--arabic); direction:rtl; font-size:26px; line-height:1.6; color:var(--ink)}
  .rx-ar.big{font-size:38px; text-align:center; margin:6px 0 10px}
  .rx-en{font-size:15px; color:var(--ink); margin-top:2px}
  .rx-use{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5}
  .rx-reply{font-size:12px; color:var(--verdigris); margin-top:5px}
  .rx-reply span{font-family:var(--arabic); font-size:16px}
  .rx-noaud{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  .rx-flag{color:var(--ochre); font-weight:700}
  .rx-ok{color:var(--verdigris); font-weight:700}
  .rx-lex{color:var(--muted); font-weight:700}
  .rx-drill{border:1px solid var(--rule); border-radius:12px; padding:22px 18px; text-align:center; max-width:520px; margin:0 auto}
  .rx-drill-n{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .rx-cue{font-family:var(--serif); font-size:24px; margin:10px 0 14px; color:var(--ink)}
  /* Sounds */
  .snd-target{font-family:var(--arabic); font-size:22px; color:var(--verdigris); margin:0 0 12px}
  .snd-target span{font-size:26px}
  .snd-tip{margin:0 0 18px}
  .snd-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-3); flex-wrap:wrap}
  .snd-cell{display:flex; align-items:center; gap:9px; flex:1; min-width:150px}
  .snd-cell.dim{opacity:.72}
  .snd-vs{color:var(--muted); font-size:16px; flex:none}
  .snd-ar{font-family:var(--arabic); direction:rtl; font-size:24px; color:var(--ink)}
  .snd-tr{font-family:var(--mono); font-size:12.5px; color:var(--verdigris)}
  .snd-gl{font-size:12.5px; color:var(--muted)}
  .say.sm{width:26px; height:26px; flex:none}
  .ear{border:1px solid var(--rule); border-radius:10px; padding:16px; text-align:center; max-width:420px}
  .ear [dir="rtl"]{font-family:var(--arabic); font-size:22px}
  /* The Dinner Table */
  .tbl-cast{display:flex; flex-wrap:wrap; gap:8px 18px; margin:0 0 12px; font-size:12.5px; color:var(--muted)}
  .tbl-cast b{color:var(--verdigris); font-family:var(--arabic); font-size:15px}
  .tbl-listen{margin:6px 0 18px}
  .tbl-lines{margin-top:8px}
  .tbl-line{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--paper-3)}
  .tbl-sp{flex:none; width:78px; font-family:var(--arabic); font-size:14px; color:var(--verdigris); text-align:left; padding-top:4px}
  .tbl-body{flex:1}
  .tbl-ar{font-family:var(--arabic); direction:rtl; font-size:22px; line-height:1.7; color:var(--ink)}
  .tbl-en{font-size:13px; color:var(--muted); margin-top:2px}
  .tbl-lines[data-en="off"] .tbl-en{display:none}
  .tbl-q{margin:8px 0}
  .tbl-q-q{font-size:14px; color:var(--ink); margin-bottom:5px}
  .tbl-q-a{display:none; font-size:13px; color:var(--verdigris); margin-top:6px}
  .tbl-q-a.show{display:block}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.55; margin:0 0 16px}

  /* ---------- home ---------- */
  /* The front door of an Arabic app had no Arabic on it, two identically-weighted hero boxes,
     and sixteen outlined rectangles of equal weight. This gives it a masthead, one dominant
     card, and a daily phrase you can actually hear. */
  /* Masthead set like a broadsheet: tatreez band, centred calligraphic wordmark, a dateline
     between a thick-thin rule pair. The embroidery is the Palestinian visual signature — more
     honest on this page than any photograph. */
  .tz{display:block; width:100%}
  .hm-mast{margin:2px 0 0}
  .hm-mast-in{text-align:center; padding:20px 0 14px}
  .hm-ed{font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:var(--muted)}
  .hm-mark{font-family:var(--arabic); direction:rtl; font-size:clamp(42px, 6.5vw, 62px);
    line-height:1.25; color:var(--ink); margin:6px 0 0}
  .hm-mark em{font-style:normal; color:var(--rubric)}
  .hm-dl{display:flex; justify-content:space-between; align-items:center; gap:12px;
    border-top:3px double var(--rule); border-bottom:1px solid var(--rule);
    padding:6px 2px; font-family:var(--mono); font-size:10.5px; color:var(--muted);
    letter-spacing:.06em}
  .hm-dl .ar{font-family:var(--arabic); font-size:14px; color:var(--ink-soft); direction:rtl;
    letter-spacing:0}
  /* The skyline: a line engraving of the Old City that the day's cards rise out of. */
  .hm-skyband{position:relative; margin:10px 0 -40px; pointer-events:none;
    -webkit-mask-image:linear-gradient(#000 55%, transparent 96%);
    mask-image:linear-gradient(#000 55%, transparent 96%)}
  .hm-sky{display:block; width:100%; height:17.5vw; max-height:200px}
  @media (max-width:700px){ .hm-skyband{margin-bottom:-14px} }
  .hm-top{position:relative; z-index:1}
  .hm-plan, .hm-phrase{box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}

  /* The two things you came for, side by side on a wide screen. */
  .hm-top{display:grid; grid-template-columns:1.35fr 1fr; gap:12px; margin-bottom:12px}
  @media (max-width:820px){ .hm-top{grid-template-columns:1fr} }

  .hm-plan{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
    border:1px solid var(--rule); border-radius:10px; padding:22px 22px 20px; color:var(--ink);
    background:linear-gradient(160deg, var(--paper-2), var(--paper)); position:relative;
    overflow:hidden}
  .hm-plan:hover{border-color:var(--verdigris)}
  .hm-plan::before{content:''; position:absolute; inset:0 auto 0 0; width:4px; background:var(--pc, var(--verdigris))}
  .hm-k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--pc, var(--verdigris))}
  .hm-t{font-family:var(--serif); font-size:30px; line-height:1.15; margin:8px 0 4px}
  .hm-s{font-size:13px; color:var(--muted); line-height:1.55; max-width:46ch}
  .hm-bar{height:5px; border-radius:3px; background:var(--rule); overflow:hidden; margin-top:16px}
  .hm-bar i{display:block; height:100%; background:var(--pc, var(--verdigris))}
  .hm-meta{display:flex; gap:14px; font-family:var(--mono); font-size:11px; color:var(--muted);
    margin-top:8px; flex-wrap:wrap}

  /* Phrase of the day — real Arabic on the front page, and you can hear it. */
  .hm-phrase{border:1px solid var(--rule); border-radius:10px; padding:20px 20px 16px;
    background:linear-gradient(160deg, var(--paper-2), var(--paper)); display:flex;
    flex-direction:column}
  .hm-ph-ar{font-family:var(--arabic); direction:rtl; font-size:34px; line-height:1.5;
    margin:10px 0 2px; color:var(--ink)}
  .hm-ph-en{font-family:var(--serif); font-size:17px; margin-bottom:6px}
  .hm-ph-use{font-size:11.5px; color:var(--muted); line-height:1.55; flex:1}
  .hm-ph-row{display:flex; align-items:center; gap:8px; margin-top:12px}
  .hm-ph-row .tog{padding:6px 12px; font-size:12px}

  /* News, demoted from a full hero to one line you can scan past. */
  .hm-news{display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit;
    cursor:pointer; border:1px solid var(--rule); border-radius:9px; padding:13px 16px;
    background:none; color:var(--ink); margin-bottom:26px}
  .hm-news:hover{border-color:var(--verdigris)}
  .hm-news.warn{border-color:var(--ochre)}
  .hm-news .k{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
    white-space:nowrap}
  .hm-news .t{font-family:var(--serif); font-size:15px; flex:1; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .hm-news .ar{font-family:var(--arabic); direction:rtl; font-size:17px; color:var(--ink-soft);
    white-space:nowrap}
  .hm-news .s{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap}
  @media (max-width:700px){ .hm-news .ar, .hm-news .s{display:none} }

  /* Tiles: use the icons every section already declares, and tint each group. */
  .hm-gh{display:flex; align-items:baseline; gap:10px; margin:22px 0 10px}
  .hm-gh b{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--gc, var(--muted));
    font-weight:600}
  .hm-gh span{font-size:11.5px; color:var(--muted)}
  .tile-h{display:flex; align-items:center; gap:9px}
  .tile-i{flex:0 0 auto; width:30px; height:30px; border-radius:8px; display:grid;
    place-items:center; color:var(--gc, var(--verdigris));
    background:color-mix(in srgb, var(--gc, var(--verdigris)) 12%, transparent)}
  .tile:hover .tile-i{background:var(--gc, var(--verdigris)); color:var(--paper)}
  .tile{transition:border-color .12s}
  .tile:hover{border-color:var(--gc, var(--verdigris))}

  /* ---------- tray ---------- */
  .tray{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--paper);
        border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom)}
  .tray .in{max-width:var(--maxw); margin:0 auto; padding:11px 18px; display:flex;
            align-items:center; gap:14px; min-height:var(--tray)}
  .tray .n{font-size:13px; color:var(--ink-soft); white-space:nowrap}
  .tray .n b{color:var(--ochre); font-variant-numeric:tabular-nums}
  .tray .sp{flex:1}
  .tray button{font:inherit; font-size:13px; padding:8px 14px; border-radius:5px;
               cursor:pointer; border:1px solid var(--rule); background:none;
               color:var(--ink-soft); white-space:nowrap}
  .tray button.go{background:var(--verdigris); border-color:var(--verdigris);
                  color:var(--paper)}
  .tray button:disabled{opacity:.4; cursor:default}

  .note{font-size:12px; line-height:1.6; color:var(--muted); border:1px solid var(--rule);
        border-radius:5px; padding:11px 13px; margin-top:22px}
  .note b{color:var(--ink-soft)}
  /* ---------- Arabic keyboard (shared, for anyone without one on their machine) ---------- */
  .kbd-wrap{position:relative}
  .kbd-tog{position:absolute; top:50%; transform:translateY(-50%); right:7px;
    font-family:var(--arabic); font-size:17px; line-height:1; width:30px; height:30px;
    border:1px solid var(--rule); border-radius:7px; background:var(--paper);
    color:var(--muted); cursor:pointer; padding:0}
  .kbd-tog:hover{color:var(--ink); border-color:var(--verdigris)}
  .kbd-tog.on{background:var(--verdigris); border-color:var(--verdigris); color:#fff}
  .kbd-wrap > input, .kbd-wrap > textarea{padding-right:44px}
  /* An RTL field starts its text at the right edge — exactly where the button would sit. */
  .kbd-wrap.rtl > .kbd-tog{right:auto; left:7px}
  .kbd-wrap.rtl > input{padding-right:11px; padding-left:44px}
  .kbd-tog.inline{position:static; transform:none; width:38px; height:38px; font-size:18px;
    flex:0 0 auto; align-self:flex-end}
  #akbd{position:fixed; left:0; right:0; bottom:var(--tray); z-index:60; background:var(--paper);
    border-top:1px solid var(--rule); box-shadow:0 -8px 24px rgba(0,0,0,.10);
    padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
  #akbd[hidden]{display:none}
  .akbd-in{max-width:var(--maxw); margin:0 auto}
  .akbd-hd{display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
  .akbd-x{font:inherit; font-size:12px; text-transform:none; letter-spacing:0; border:0;
    background:none; color:var(--verdigris); cursor:pointer; padding:2px 4px; touch-action:none}
  .akbd-r{display:flex; justify-content:center; gap:4px; margin-bottom:4px}
  .akbd-k{position:relative; font-family:var(--arabic); font-size:19px; line-height:1;
    flex:1 1 0; min-width:0; max-width:46px; height:40px; border:1px solid var(--rule);
    border-radius:7px; background:var(--paper-2); color:var(--ink); cursor:pointer; padding:0;
    touch-action:none; user-select:none; -webkit-user-select:none}
  .akbd-k:active{background:var(--verdigris); border-color:var(--verdigris); color:#fff}
  .akbd-k.wide{flex:3.4 1 0; max-width:none; font-family:var(--sans); font-size:12px}
  .akbd-k.fn{font-family:var(--sans); font-size:14px; max-width:62px; flex:1.5 1 0}
  /* A hint that the key hides variants under a long press — iOS shows nothing, but nobody
     discovers أ that way unless they already know the trick. */
  .akbd-k.more::after{content:''; position:absolute; top:3px; inset-inline-end:4px; width:3px;
    height:3px; border-radius:50%; background:var(--muted)}
  .akbd-k.more:active::after{background:rgba(255,255,255,.7)}
  .akbd-pop{position:absolute; z-index:2; display:flex; gap:4px; padding:5px;
    background:var(--paper); border:1px solid var(--rule); border-radius:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .akbd-pop .akbd-k{flex:0 0 auto; width:40px; max-width:none}
  @media (max-width:420px){ .akbd-k{font-size:17px; height:36px} }
  /* ---------- verbs ---------- */
  .vsearch{width:100%; font:inherit; font-size:15px; padding:11px 14px; margin:2px 0 6px;
      border:1px solid var(--rule); border-radius:8px; background:var(--paper-2);
      color:var(--ink); -webkit-appearance:none}
  .vsearch:focus{outline:none; border-color:var(--verdigris); background:var(--paper)}
  .vsearch::placeholder{color:var(--muted)}

  .vtiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media(max-width:560px){.vtiles{grid-template-columns:1fr}}
  .vtile{text-align:left; font:inherit; cursor:pointer; border:1px solid var(--rule);
      background:none; color:var(--ink); border-radius:8px; padding:14px 15px}
  .vtile.wide{width:100%}
  .vtile:hover{border-color:var(--verdigris); background:var(--verdigris-2)}
  .vtile:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
  .vtile-h{display:flex; align-items:baseline; gap:9px}
  .vtile-t{font-family:var(--serif); font-size:17px; line-height:1.2}
  .vtile-n{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--verdigris);
      font-variant-numeric:tabular-nums}
  .vtile-s{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5}

  .vlist{display:grid; gap:10px}
  .vc{border:1px solid var(--rule); border-radius:8px; padding:13px 15px; background:var(--paper-2)}
  .vc-h{display:flex; align-items:baseline; gap:10px}
  .vc-gl{font-family:var(--serif); font-size:16px; line-height:1.3; color:var(--ink)}
  .vc-badges{margin-left:auto; display:flex; gap:6px; flex:none}
  .b-form,.b-wk{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em;
      text-transform:uppercase; border-radius:3px; padding:2px 7px; white-space:nowrap}
  .b-form{background:var(--verdigris); color:var(--paper); font-weight:600}
  .b-wk{border:1px solid var(--ochre); color:var(--ochre)}
  .vc-root{font-family:var(--arabic); direction:rtl; text-align:right; font-size:15px;
      color:var(--muted); margin:2px 0 11px}
  .vc-pp{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .pp{display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px;
      background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:9px 6px}
  .pp-k{font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .pp-ar{font-family:var(--arabic); direction:rtl; font-size:23px; line-height:1.45; color:var(--ink)}
  .pp-c{font-family:var(--mono); font-size:11px; color:var(--verdigris); word-break:break-all}
  .b-cj{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
      border-radius:3px; padding:2px 7px; background:var(--verdigris-2); color:var(--verdigris);
      border:1px solid var(--verdigris)}
  .vc{cursor:pointer; width:100%; text-align:left; font:inherit; color:var(--ink)}

  /* ---- verb detail / conjugation ---- */
  .vd-head{display:flex; align-items:baseline; gap:14px; margin:2px 0 20px;
      padding-bottom:16px; border-bottom:1px solid var(--rule)}
  .vd-ar{font-family:var(--arabic); direction:rtl; font-size:38px; line-height:1.1; color:var(--ink)}
  .vd-gl{font-family:var(--serif); font-size:18px; line-height:1.3}
  .vd-sub{font-size:12.5px; color:var(--muted); margin-top:5px}
  .vd-sub .b-form,.vd-sub .b-wk{font-size:9.5px}

  .cj-tbl{display:grid; gap:6px; margin-bottom:20px}
  .cj-row{display:grid; grid-template-columns:minmax(58px,0.8fr) 1fr 1fr 1fr; gap:6px; align-items:stretch}
  .cj-hdr{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
      font-weight:700; padding:0 2px}
  .cj-hdr>div{padding:2px 4px}
  .cj-pr{display:flex; flex-direction:column; justify-content:center; gap:1px; padding:6px 4px}
  .cj-pr-ar{font-family:var(--arabic); direction:rtl; font-size:16px; color:var(--ink-soft); line-height:1.2}
  .cj-pr-en{font-size:10px; color:var(--muted)}
  .cj-cell{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      text-align:center; background:var(--paper-2); border:1px solid var(--rule); border-radius:6px;
      padding:8px 5px}
  .vd-note{margin:10px 0 2px; padding:9px 12px; border-radius:9px; font-size:13px;
    color:var(--ink-soft); background:var(--paper-2); border:1px solid var(--rule)}
  .cj-ar{font-family:var(--arabic); direction:rtl; font-size:21px; line-height:1.4; color:var(--ink)}
  .cj-ph{font-family:var(--mono); font-size:10.5px; color:var(--verdigris); word-break:break-all}
  .cj-k{font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .cj-mini{margin-bottom:16px}
  .cj-mini-row{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  @media(max-width:520px){
    .cj-ar{font-size:18px} .cj-cell{padding:7px 3px} .cj-row{gap:4px}
    .cj-pr-ar{font-size:14px}
  }

  /* ---------- vocabulary / SRS ---------- */
  .say{flex:none; width:30px; height:30px; border-radius:50%; cursor:pointer; padding:0;
       border:1px solid var(--rule); background:none; color:var(--verdigris);
       display:inline-flex; align-items:center; justify-content:center; vertical-align:middle}
  .say:hover{background:var(--verdigris-2); border-color:var(--verdigris)}
  .say svg{width:16px; height:16px}
  .wc .hw .say{margin-right:8px}
  .vstats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:4px 0 8px}
  .vstat{border:1px solid var(--rule); border-radius:7px; padding:12px; text-align:center}
  .vstat b{display:block; font-family:var(--serif); font-size:24px; color:var(--verdigris)}
  .vstat span{font-size:11px; color:var(--muted)}
  /* review card */
  .rv-top{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
      text-align:center; margin-bottom:14px}
  .rv-card{border:1px solid var(--rule); border-radius:10px; padding:28px 18px; text-align:center;
      background:var(--paper-2); min-height:180px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:10px}
  .rv-front{font-family:var(--arabic); direction:rtl; font-size:44px; line-height:1.4; color:var(--ink)}
  .rv-showbtn{margin-top:14px; font:inherit; font-size:15px; padding:11px 26px; cursor:pointer;

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  /* ---- My Plan ---- */

  .tr-ex-en{font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:2px}
  .tr-ex-src{color:var(--verdigris)}
  .tr-wbw{display:grid; gap:6px; margin-bottom:6px}
  .tr-tok{display:flex; align-items:baseline; gap:12px; border:1px solid var(--rule); border-radius:7px; padding:9px 12px}
  .tr-tok-ar{font-family:var(--arabic); direction:rtl; font-size:20px; min-width:90px}
  .tr-tok-gl{font-size:13.5px; color:var(--ink-soft)}
  .tr-tok-gl i{color:var(--muted)}
  /* ---- Speaking practice ---- */
  .sk-go{border-color:var(--verdigris); color:var(--verdigris)}
  .sk-hd{margin:2px 0 14px}
  .sk-hk{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--verdigris); font-weight:700}
  .sk-ht{font-family:var(--serif); font-size:22px; margin-top:3px; line-height:1.2}
  .sk-rounds{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px}
  .sk-round{font:inherit; cursor:pointer; border:1px solid var(--rule); border-radius:8px;
    background:none; color:var(--ink); padding:12px 6px; text-align:center; position:relative}
  .sk-round b{display:block; font-family:var(--serif); font-size:18px}
  .sk-round span{font-size:11px; color:var(--muted)}
  .sk-round:hover{border-color:var(--verdigris)}
  .sk-round.on{border-color:var(--verdigris); background:var(--verdigris-2)}
  .sk-round.done{border-color:var(--verdigris)}
  .sk-round.done::after{content:'✓'; position:absolute; top:5px; right:7px; font-size:11px; color:var(--verdigris)}
  .sk-timer{text-align:center; border:1px solid var(--rule); border-radius:10px; padding:18px 12px; margin-bottom:16px}
  .sk-time{font-family:var(--mono); font-size:52px; font-weight:600; letter-spacing:.02em; line-height:1}
  .sk-status{font-size:12.5px; color:var(--ochre); min-height:17px; margin-top:8px; line-height:1.4}
  .sk-peek{font:inherit; font-size:12.5px; color:var(--verdigris); background:none; border:none;
    padding:2px 0 8px; cursor:pointer}
  .sk-ref{display:none; border:1px solid var(--rule); border-radius:8px; padding:4px 12px; margin-bottom:8px}
  .sk-ref.open{display:block}
  .sk-ref-s{padding:9px 0; border-bottom:1px solid var(--rule)}
  .sk-ref-s:last-child{border-bottom:none}
  .sk-ref-s .ar{font-family:var(--arabic); font-size:19px; line-height:1.7}
  .sk-ref-en{font-size:12.5px; color:var(--muted); margin-top:2px}
  .sk-shadow{border:1px solid var(--rule); border-radius:8px; padding:11px 12px; margin-bottom:8px}
  .sk-shadow .ar{font-family:var(--arabic); font-size:20px; line-height:1.7; margin-bottom:8px}
  /* ---- Books ---- */
  .bk-cover{display:block; width:100%; text-align:left; font:inherit; cursor:pointer; color:var(--ink);
    border:1px solid var(--rule); border-left:4px solid var(--rubric); border-radius:8px;
    background:var(--paper-2); padding:18px 16px; margin-bottom:12px}
  .bk-cover:hover{border-color:var(--verdigris); border-left-color:var(--rubric)}
  .bk-cover-ar{font-family:var(--arabic); direction:rtl; font-size:26px; line-height:1.5}
  .bk-cover-en{font-family:var(--serif); font-size:17px; margin-top:4px}
  .bk-cover-s{font-size:12px; color:var(--muted); margin-top:6px}
  .bk-shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;
    margin-bottom:6px}
  .bk-src{font-size:11.5px; color:var(--muted); margin:0 0 10px; line-height:1.5}
  .bk-hero{text-align:center; padding:10px 0 6px; margin-bottom:14px}
  .bk-hero-ar{font-family:var(--arabic); direction:rtl; font-size:34px; line-height:1.5}
  .bk-hero-en{font-family:var(--serif); font-size:20px; margin-top:4px}
  .bk-hero-s{font-size:12px; color:var(--muted); margin-top:6px}
  .bk-ch{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; cursor:pointer;
    color:var(--ink); border:1px solid var(--rule); border-radius:8px; background:none; padding:11px 13px; margin-bottom:8px}
  .bk-ch:hover{border-color:var(--verdigris)}
  .bk-ch-n{flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:13px; color:var(--muted); border:1px solid var(--rule)}
  .bk-ch-n.read{color:#fff; background:var(--verdigris); border-color:var(--verdigris)}
  .bk-ch-t{display:flex; flex-direction:column; min-width:0}
  .bk-ch-t b{font-family:var(--arabic); direction:rtl; font-size:18px; font-weight:400}
  .bk-ch-t span{font-size:12px; color:var(--muted)}
  .bk-chnav{margin-top:20px; padding-top:16px; border-top:1px solid var(--rule)}
  /* Bible: book grid, chapter grid, parallel reader */
  .bib-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:6px 0 16px}
  .bib-b{display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%;
    font:inherit; cursor:pointer; text-align:left; color:var(--ink); background:none;
    border:1px solid var(--rule); border-radius:9px; padding:10px 12px}
  .bib-b:hover{border-color:var(--verdigris)}
  .bib-b-en{font-size:15px}
  .bib-b-ar{font-family:var(--arabic); font-size:15px; color:var(--muted)}
  .bib-hd{text-align:center; padding-bottom:14px; border-bottom:1px solid var(--rule); margin-bottom:16px}
  .bib-hd-en{font-family:var(--serif); font-size:26px}
  .bib-hd-ar{font-family:var(--arabic); direction:rtl; font-size:22px; color:var(--muted); margin-top:2px}
  .bib-hd-s{font-size:12px; color:var(--muted); margin-top:4px}
  .bib-chs{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:8px}
  .bib-ch{aspect-ratio:1; font:inherit; font-size:16px; cursor:pointer; color:var(--ink);
    background:none; border:1px solid var(--rule); border-radius:8px; font-variant-numeric:tabular-nums}
  .bib-ch:hover{border-color:var(--verdigris); color:var(--verdigris)}
  .bib-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 14px}
  .bib-nav>*{flex:0 0 auto}
  .bib-read{max-width:1100px; margin:0 auto}
  .bib-v{display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:9px 0; border-bottom:1px solid var(--rule-soft,rgba(128,128,128,.12))}
  .bib-en{font-family:var(--serif); font-size:16px; line-height:1.65}
  .bib-ar{font-family:var(--arabic); direction:rtl; font-size:20px; line-height:1.9}
  .bib-vn{font-size:11px; color:var(--verdigris); font-family:var(--mono); vertical-align:super; margin-inline-start:2px}
  @media(max-width:640px){
    .bib-v{grid-template-columns:1fr; gap:4px; padding:11px 0}
    .bib-en{font-size:15px; opacity:.92} .bib-ar{font-size:19px}
  }
  /* printable book (screen preview) */
  .bk-print{max-width:640px; margin:0 auto}
  .bk-print-title{text-align:center; padding:20px 0 26px; border-bottom:2px solid var(--rule); margin-bottom:22px}
  .bk-print-title .ar{font-family:var(--arabic); direction:rtl; font-size:34px; line-height:1.5}
  .bk-print-title .en{font-family:var(--serif); font-size:22px; margin-top:6px}
  .bk-print-title .sub{font-size:13px; color:var(--muted); margin-top:10px}
  .bk-print-title .sub2{font-size:11px; color:var(--ochre); margin-top:4px}
  .bk-print-ch h2{font-family:var(--arabic); direction:rtl; font-size:24px; margin:24px 0 2px; font-weight:400}
  .bk-print-ch h3{font-family:var(--serif); font-size:15px; color:var(--muted); font-weight:400; margin:0 0 14px}
  /* bilingual paragraphs, English left / Arabic right */
  .bk-print-p{display:grid; grid-template-columns:1fr 1fr; gap:14px 26px; margin-bottom:18px; align-items:start}
  .bk-print-p .ar{font-family:var(--arabic); direction:rtl; font-size:20px; line-height:1.95}
  .bk-print-p .en{font-size:14px; color:var(--muted); line-height:1.7}
  @media (max-width:640px){ .bk-print-p{grid-template-columns:1fr; gap:5px} }
  /* reader in paragraph mode (books) */
  .rd-para .ar{line-height:2}
  .rd-para{margin-bottom:20px}
  /* the "whole passage" header that sits above the split sentences */
  .para-head{padding-bottom:22px; border-bottom:1px solid var(--paper-3); margin-bottom:26px}
  .pl-cap{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  /* sentence punctuation (periods, commas, ؟) re-inserted between the tappable word spans */
  .rd .pu{font-family:var(--arabic); color:var(--ink)}
  /* arLive() output: tappable words outside the reader. Inline, so it can sit inside any
     existing Arabic line (a reaction, a lesson chunk, a grammar example) without disturbing
     that line's own size, direction or leading. */
  /* the floating "Ask the tutor" that follows a selection */
  .askbtn{position:fixed; z-index:60; padding:7px 12px; border-radius:999px;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.22); white-space:nowrap}
  .askbtn:hover{background:var(--verdigris); border-color:var(--verdigris)}
  @media print{.askbtn{display:none}}

  /* Doubled class = specificity (0,2,0), deliberately. arLive() drops spans into containers
     that were written before it existed, and some of them style their descendants by ELEMENT:
     `.lsn-gx span{display:block}` caught every injected word and stacked a grammar example one
     word per line. These rules have to outrank a plain `.thing span` selector wherever they land,
     so the inserted markup stays invisible to layout — a run of text, exactly as before. */
  .lx.lx{display:inline}
  .lx .pu{display:inline; font-size:inherit; color:inherit}
  .lx .lw{display:inline-block; padding:1px 2px; line-height:inherit; font-size:inherit}
  .lx .lw.gap{border-bottom:1px dotted var(--paper-3)}
  .wcut{font-size:12px; color:var(--muted); margin:-4px 0 8px; font-family:var(--sans)}
  .wc-banks{margin-top:9px; font-size:11.5px; line-height:1.5; color:var(--muted); font-family:var(--sans)}

  /* ---- section hero: one skeleton, a different drawing per section ---- */
  .sh{position:relative; margin:-4px 0 20px; padding:20px 0 0; overflow:hidden; isolation:isolate;
    min-height:126px; display:flex; flex-direction:column; justify-content:flex-end}
  /* The drawing occupies the right of the band and fades out before it reaches the wordmark —
     the first attempt stretched it across the full width with `slice`, which scaled a 32-unit
     motif up past 100px and turned dense embroidery into four sparse sparkles. Fitting by
     HEIGHT keeps every motif at its drawn density whatever the screen is doing. */
  .sh-art{position:absolute; top:0; right:-2%; bottom:0; width:min(64%, 620px); height:100%;
    color:var(--gc); opacity:.3; z-index:0; pointer-events:none;
    -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 42%, #000 88%, transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0%, #000 42%, #000 88%, transparent 100%)}
  .sh-in{position:relative; z-index:1; display:flex; flex-direction:column; gap:2px;
    padding-bottom:16px}
  /* The section's own name, drawn large — the "calligraphy" is a word you're learning. */
  .sh-ar{font-family:var(--arabic); direction:rtl; text-align:left;
    font-size:clamp(34px, 5.4vw, 52px); line-height:1.16; color:var(--ink)}
  .sh-en{font-family:var(--sans); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gc); font-weight:600}
  .sh-rule{position:relative; z-index:1; height:2px; background:var(--gc); opacity:.5;
    border-radius:2px}
  /* Narrow: the drawing would crowd the word, so it retreats to a faint texture behind it. */
  @media (max-width:640px){ .sh{margin-bottom:16px; padding-top:14px; min-height:104px}
    .sh-art{width:78%; opacity:.16;
      -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 55%);
      mask-image:linear-gradient(90deg, transparent 0%, #000 55%)}
    .sh-in{padding-bottom:12px} }
  @media print{ .sh-art{display:none} }
  /* duplicate-merge review */
  .mg-nudge{margin:14px 0 4px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.6;
    background:var(--ochre-wash); border:1px solid var(--ochre); color:var(--ink)}
  .mg-nudge .tog{margin-left:6px}
  .mg{border:1px solid var(--rule); border-radius:9px; padding:12px 13px; margin-top:11px}
  .mg-rows{display:flex; flex-direction:column; gap:7px; margin-bottom:10px}
  .mg-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; font-size:13px}
  .mg-row.keep{font-weight:600}
  .mg-ar{font-family:var(--arabic); font-size:19px; min-width:5em}
  .mg-gl{color:var(--ink-soft); flex:1}
  .mg-st{font-size:11.5px; color:var(--muted); font-family:var(--mono)}
  .mg-tag{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .mg-row.keep .mg-tag{color:var(--verdigris)}
  .wc-banks b{font-family:var(--arabic); font-size:14px; color:var(--ink-soft); font-weight:400}
  /* shown on a word tapped in the Van Dyck Bible — readable, not bankable */
  .msa-note{margin:12px 0 4px; padding:10px 12px; border-radius:9px; font-size:12.5px;
    line-height:1.5; background:var(--paper-2); border:1px solid var(--paper-3); color:var(--ink-soft)}
  /* a question carried in from a selection, waiting on a key */
  .tut-held{margin:14px 0; padding:12px 14px; border-radius:10px; font-size:14px;
    background:var(--ochre-wash); border:1px solid var(--ochre); color:var(--ink)}
  .tut-held-q{display:block; margin:6px 0; font-style:italic; color:var(--ink-soft)}
  /* embedded YouTube (Videos section) — responsive 16:9, rounded to match the app */
  .yt-wrap{position:relative; width:100%; aspect-ratio:16/9; background:#000;
    border-radius:12px; overflow:hidden; border:1px solid var(--paper-3)}
  .yt-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  .yt-meta{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:10px; margin-top:12px; color:var(--muted); font-size:13px}
  .yt-meta a{color:var(--verdigris)}
  /* plan extras: streak, warm-up, record, and the dashboard */
  .streak{font-size:12px; color:var(--ochre); font-weight:600; margin-right:8px}
  .warmup, .recard{border:1px solid var(--rule); border-radius:9px; padding:12px 14px; margin-bottom:14px; background:var(--paper-2)}
  .warmup.done, .recard.done{opacity:.6}
  .warmup-h{display:flex; align-items:center; gap:10px}
  .warmup-t{font-weight:600; flex:1}
  .wex{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:14px}
  .wex-q{flex:1; color:var(--muted)}
  .wex-a{font-family:var(--arabic); font-size:18px; color:var(--ink)}
  #recBtn.rec-on{background:var(--brick,#B4372A); color:#fff}
  .dstats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:6px 0 4px}
  @media (max-width:560px){ .dstats{grid-template-columns:repeat(2,1fr)} }
  .dstat{border:1px solid var(--rule); border-radius:9px; padding:12px; text-align:center}
  .dstat-v{font-size:22px; font-weight:700; color:var(--ink)}
  .dstat-k{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-top:3px}
  .dchart{display:flex; align-items:flex-end; gap:5px; height:120px; padding:6px 2px 0}
  .dbar{flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end}
  .dbar i{display:block; width:100%; max-width:22px; background:var(--verdigris); border-radius:3px 3px 0 0; min-height:2px}
  .dbar-x{font-size:9px; color:var(--muted); margin-top:4px}
  .dcov{margin:8px 0}
  .dcov-h{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:4px}
  .dtrouble{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--paper-3)}
  .dtrouble > span[dir="rtl"]{font-family:var(--arabic); font-size:19px; min-width:80px}
  .dtr-gl{flex:1; color:var(--muted); font-size:14px}
  .dtr-e{font-family:var(--mono); font-size:11px; color:var(--ochre)}
  @media print {
    .top, .tray, .sidebar, .side-scrim, .bk-noprint { display:none !important; }
    html, body { background:#fff !important; color:#000 !important; }
    .wrap, #view { margin:0 !important; padding:0 !important; max-width:none !important; }
    .bk-print { max-width:none; }
    .bk-print-title .ar, .bk-print-ch h2, .bk-print-p .ar { color:#000 !important; }
    .bk-print-p .en, .bk-print-ch h3 { color:#333 !important; }
    .bk-print-title { border-color:#000; }
    .bk-print-ch { page-break-before:always; }
    .bk-print-title + .bk-print-ch, .bk-print-ch:first-of-type { page-break-before:avoid; }
    .bk-print-p { page-break-inside:avoid; }
  }
  /* guided shadow */
  .gs-launch{display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
    border:1px solid var(--verdigris); background:var(--verdigris-2); color:var(--verdigris);
    border-radius:9px; padding:13px 15px; font-size:15px; font-weight:600; margin-bottom:12px}
  .gs-launch span{display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:3px}
  .gs-launch:hover{border-color:var(--verdigris); filter:brightness(1.03)}
  .gs-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    font-family:var(--mono); font-size:12px; color:var(--muted)}
  .gs-top .pspd{display:flex; gap:4px}
  .gs-card{border:1px solid var(--rule); border-radius:12px; padding:26px 18px; text-align:center; min-height:190px;
    display:flex; flex-direction:column; justify-content:center; transition:border-color .2s,background .2s}
  .gs-card.gs-listen{border-color:var(--verdigris); background:var(--verdigris-2)}
  .gs-card.gs-turn{border-color:var(--ochre); background:var(--ochre-wash)}
  .gs-phase{font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
    color:var(--muted); margin-bottom:14px}
  .gs-listen .gs-phase{color:var(--verdigris)}
  .gs-turn .gs-phase{color:var(--ochre)}
  .gs-ar{font-family:var(--arabic); font-size:30px; line-height:1.7; color:var(--ink)}
  .gs-en{font-size:13.5px; color:var(--muted); margin-top:10px; line-height:1.5}
  .gs-progbar{height:6px; border-radius:4px; background:var(--paper-3); margin-top:18px; overflow:hidden}
  .gs-progbar.off{visibility:hidden}
  .gs-progbar i{display:block; height:100%; background:var(--ochre); border-radius:4px; width:0}
  .gs-done{text-align:center; padding:44px 16px}
  .gs-done-t{font-family:var(--serif); font-size:24px; color:var(--verdigris); margin-bottom:8px}
  .gs-done p{font-size:14px; color:var(--muted); line-height:1.6; margin:0}
  /* ---- Ask a Tutor (BYOK chat) ---- */
  .tut-log{display:flex; flex-direction:column; gap:12px; margin:6px 0 16px}
  .tut-b{max-width:88%; padding:11px 14px; border-radius:14px; font-size:14.5px; line-height:1.55;
    white-space:normal; word-wrap:break-word}
  .tut-b.me{align-self:flex-end; background:var(--verdigris); color:#fff; border-bottom-right-radius:5px}
  .tut-b.ai{align-self:flex-start; background:var(--paper-2); color:var(--ink);
    border:1px solid var(--rule); border-bottom-left-radius:5px}
  .tut-b.err{align-self:flex-start; background:var(--ochre-wash); color:var(--ink-soft);
    border:1px solid var(--ochre); font-size:13px}
  .tut-b b{font-weight:700}
  .tut-b .rt{font-family:var(--arabic); font-size:1.15em}
  .tut-dots{align-self:flex-start; color:var(--muted); font-size:20px; letter-spacing:3px;
    padding:6px 4px}
  .tut-row{display:flex; gap:8px; align-items:flex-end; margin-top:4px}
  .tut-row textarea{flex:1; font:inherit; font-size:15px; line-height:1.4; padding:10px 12px;
    border:1px solid var(--rule); border-radius:12px; background:var(--paper-2); color:var(--ink);
    resize:none; min-height:44px; max-height:140px}
  .tut-row textarea:focus{outline:2px solid var(--verdigris); outline-offset:1px}
  .tut-send{font:inherit; font-size:14px; padding:11px 16px; border-radius:12px;
    border:1px solid var(--verdigris); background:var(--verdigris); color:#fff; cursor:pointer;
    white-space:nowrap}
  .tut-send:disabled{opacity:.5; cursor:default}
  .tut-chip{font:inherit; font-size:12.5px; text-align:left; padding:9px 12px; border-radius:10px;
    border:1px solid var(--rule); background:none; color:var(--ink-soft); cursor:pointer; line-height:1.4}
  .tut-chip:hover{border-color:var(--verdigris); background:var(--verdigris-2)}
  .tut-chip .rt{font-family:var(--arabic)}
  .tut-saves{align-self:flex-start; max-width:88%; margin:-4px 0 2px; display:flex;
    flex-direction:column; gap:6px; padding:10px 0 2px}

    padding:2px 14px}

    color:var(--muted); font-style:normal; line-height:1.5; margin-top:2px}
  .lsn-finish{margin-top:22px; padding-top:16px; border-top:1px solid var(--rule)}
  .lsn-prog{font-size:12.5px; color:var(--muted); margin-bottom:9px}
  .lsn-prog b{color:var(--ochre)}

  .lsn-fin:disabled{opacity:.45; cursor:not-allowed}

  .phlab select{display:block; width:100%; margin-top:5px; font:inherit; font-size:15px;
    text-transform:none; letter-spacing:0; padding:8px 10px; border-radius:8px;
    border:1px solid var(--rule); background:var(--bg); color:var(--ink)}
  /* ---- placement assessment ---- */
  .as-ar{display:block; font-family:var(--arabic); direction:rtl; font-size:30px; line-height:1.9;
    color:var(--ink); margin-bottom:4px}

    font-weight:700; margin:12px 0 10px}

<body>
<div class="wrap">

      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 id="title" onclick="location.hash='/'" style="cursor:pointer">Palestinian Arabic</h1>

  </div>

</div>

<div class="cardwrap" id="cw"><div class="scrim" id="scrim"></div><div class="wc" id="wc"></div></div>

<div class="tray"><div class="in">
  <span class="n"><b id="cnt">0</b> <span id="cntlbl">due</span></span>
  <span class="sp"></span>
  <button id="rev">Review</button>
  <button class="go" id="exp">Export</button>
</div></div>

<script src="data/library.js"></script>
<script src="data/verbs.js"></script>
<script src="data/vocab_audio.js"></script>
<script src="data/curriculum.js"></script>
<script src="data/assess.js"></script>
<script src="data/grammar.js"></script>
<script src="data/lessons.js"></script>
<script src="data/reactions.js"></script>
<script src="data/sounds.js"></script>
<script src="data/table.js"></script>
<script src="data/bible-index.js"></script>
<script src="vendor/supabase.js"></script>
<script src="data/supaconfig.js"></script>
<script src="data/pushconfig.js"></script>
<script>
// ---------- persistence: the memorization deck ----------
// localStorage, on this device, no server. Each word you "don't know" becomes a CARD keyed
// by LEMMA (so it's the same card in every text), carrying its lexicon data, the sentence you
// met it in, and its spaced-repetition state (Anki's SM-2). `marked` = the card map; the
// reader highlights any word that has a card.
const KEY = 'alp.cards.v1';
const DKEY = 'alp.decks.v1';
const now = () => Date.now();
const DAY = 864e5;

let marked = new Map();
try { marked = new Map(JSON.parse(localStorage.getItem(KEY) || 'null') || []); } catch (e) {}
if (!marked.size) {   // one-time migration from the old marked-words list
  try {
    const old = JSON.parse(localStorage.getItem('alp.marked.v1') || '[]');
    for (const [l, m] of old) marked.set(l, srsInit({lemma: l, ...m, deck: 'default'}));
  } catch (e) {}
}
// The deck is keyed by the lemma STRING, and the same word reaches it under different
// vocalizations depending on where you added it from: the reader uses the corpus's resolved
// lemma, the verb page uses verbs.js's citation form, and for 215 of 461 verb tokens those two
// disagree (إجا vs أَجَا, رَوح vs رَوَّح). Adding the same verb from two places therefore made two
// cards, each with its own schedule. Now that a word can be banked from the verb page, the
// translator and the reader, that had to be settled.
//
// Rather than re-key the deck — it is live study data, and a migration that mis-merges two
// genuinely different words is worse than the duplicate — membership is matched on the
// NORMALIZED lemma. An existing card wins its key, so a verb you banked months ago from a story
// still reads "in your deck" on its conjugation page, and removing it there removes that card.
// Namespaced keys (¶ phrases, ® reactions) keep their prefix through arNorm and never collide.
let _deckNormIx = null;
function deckNormIndex() {
  if (_deckNormIx) return _deckNormIx;
  const m = new Map();
  for (const k of marked.keys()) { const n = arNorm(k); if (!m.has(n)) m.set(n, k); }
  // Cards banked before verbs were canonicalised sit under a tense-specific lemma. Each one
  // knows its own citation form, so index that too and they keep resolving.
  for (const [k, c] of marked) { const hp = cardHePast(c);
    if (hp && hp.ar) { const n = arNorm(hp.ar); if (!m.has(n)) m.set(n, k); } }
  return (_deckNormIx = m);
}
const deckKeyFor = lemma => marked.has(lemma) ? lemma
  : (deckNormIndex().get(arNorm(lemma)) || lemma);
const inDeck = lemma => marked.has(deckKeyFor(lemma));
// For a word RECORD we can do better than the string: run it through the paradigm first, so a
// present-tense token finds the card filed under the past.
const deckKeyForWord = w => deckKeyFor((w && (verbPast(w) || {}).ar) || (w && w.lemma) || '');
const inDeckWord = w => marked.has(deckKeyForWord(w));

const save = () => { _deckNormIx = null;
  try { localStorage.setItem(KEY, JSON.stringify([...marked])); } catch (e) {} };

let decks = [];
try { decks = JSON.parse(localStorage.getItem(DKEY) || 'null') || []; } catch (e) {}
if (!decks.length) decks = [{id: 'default', name: 'My words', created: now()}];
const saveDecks = () => { try { localStorage.setItem(DKEY, JSON.stringify(decks)); } catch (e) {} };
const deckName = id => (decks.find(d => d.id === id) || {}).name || 'My words';
// The deck new cards drop into (remembered; the deck view can change it).
const AKEY = 'alp.activedeck.v1';
const activeDeck = () => { const id = localStorage.getItem(AKEY);
  return decks.some(d => d.id === id) ? id : 'default'; };
const setActiveDeck = id => { try { localStorage.setItem(AKEY, id); } catch (e) {} };

// Fresh SM-2 state for a new card (due immediately, in the learning phase).
function srsInit(c) {
  return {deck: 'default', ...c, ease: 2.5, interval: 0, due: now(), reps: 0, lapses: 0,
          lapses_: 0, created: c.created || now()};
}
// Anki-style SM-2 scheduler. g: 0 Again · 1 Hard · 2 Good · 3 Easy. Returns the next state.
function srsGrade(c, g) {
  let {ease = 2.5, interval = 0, reps = 0, lapses = 0} = c;
  if (g === 0) {                              // Again — relearn, back in ~10 min this session
    return {...c, ease: Math.max(1.3, ease - 0.2), interval: 0, reps: 0,
            lapses: lapses + 1, due: now() + 6e5};
  }
  reps += 1;
  if (g === 1) ease = Math.max(1.3, ease - 0.15);
  if (g === 3) ease += 0.15;
  if (reps === 1)      interval = g === 3 ? 4 : 1;
  else if (reps === 2) interval = g === 1 ? 3 : 6;
  else                 interval = Math.max(interval + 1,
                          Math.round(interval * (g === 1 ? 1.2 : g === 3 ? ease * 1.3 : ease)));
  return {...c, ease, interval, reps, lapses, due: now() + interval * DAY};
}
// What the four buttons would schedule, in human terms (shown under each grade button).
function srsPreview(c) {
  const fmt = ms => { const d = Math.round(ms / DAY);
    return ms < DAY ? '<10m' : d < 1 ? '1d' : d < 30 ? d + 'd' : Math.round(d / 30) + 'mo'; };
  return [0, 1, 2, 3].map(g => g === 0 ? '<10m' : fmt(srsGrade(c, g).due - now()));
}
const dueCards = () => [...marked.values()].filter(c => (c.due || 0) <= now());
const cardsInDeck = id => [...marked.values()].filter(c => (c.deck || 'default') === id);

// Audio clips are named by position (audio/<text>/s0.mp3), so re-voicing swaps the bytes but
// NOT the URL — and a browser that already played a clip keeps serving the old voice from its
// cache forever. au() stamps every audio URL with AUDIO_VERSION (emitted by build_app.py from
// the clip bytes), so any re-voice busts the cache automatically.
const AUDIO_V = window.AUDIO_VERSION || '';
const au = src => !src ? src : (AUDIO_V ? src + (src.includes('?') ? '&' : '?') + 'v=' + AUDIO_V : src);

// ---------- word audio: your Palestinian clip if we have one, else the browser's voice ----------
const VA = window.VOCAB_AUDIO || {};
let _wa = null;
function playWord(card) {
  // A phrase card carries its own clip when the span was a whole recorded sentence; otherwise
  // there is no Palestinian recording of that particular chunk and we fall back to the
  // browser voice, same as any word we never generated audio for.
  const clip = (card.kind === 'phrase' || card.kind === 'reaction' ? card.audio : null) || VA[card.lemma];
  if (clip) { try { (_wa = _wa || new Audio()).src = au(clip); _wa.playbackRate = SPEED;
                    _wa.play().catch(() => speakWord(card)); return; } catch (e) {} }
  speakWord(card);
}
function speakWord(card) {                    // browser SpeechSynthesis fallback (generic Arabic)
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(card.vocalized || card.lemma || '');
  u.lang = 'ar-SA'; u.rate = Math.min(1, SPEED);
  const v = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// Playback speed. Slow is the single most useful setting for dialect — a Palestinian
// sentence at full pace is a wall; at 0.5x you can actually pick the words apart. Kept
// in its own localStorage key so it persists across sessions like the marked list.
const SKEY = 'alp.speed.v1';
let SPEED = parseFloat(localStorage.getItem(SKEY)) || 1;
const setSpeed = v => { SPEED = v; try { localStorage.setItem(SKEY, String(v)); } catch (e) {} };
// One list, used by every speed control — the inline players and the guided-shadow view had
// their own copies and would drift apart. 0.75 is the useful middle rung: 0.5 is for picking
// a sentence apart word by word, 0.9 is "almost native", and the gap between them was too big
// to shadow comfortably.
const SPEEDS = [[0.5, '0.5×'], [0.75, '0.75×'], [0.9, '0.9×'], [1, '1×']];

// ---------- one real audio engine, many inline players ----------
// A single <audio> is reused for every line. Only one clip is ever audible; hitting play
// on a new line re-points this element and resets the previous line's transport. The
// per-line player UI (play/pause, scrubber, speed) binds to whichever line is active.
const A = new Audio();
A.preservesPitch = true; A.mozPreservesPitch = true; A.webkitPreservesPitch = true;
let activeSrc = null;

const fmt = t => (isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '0:00');

function activePlayer() {
  return activeSrc ? document.querySelector(`.player[data-src="${cssq(activeSrc)}"]`) : null;
}
function cssq(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function resetPlayer(pl) {
  if (!pl) return;
  pl.classList.remove('playing');
  const seek = pl.querySelector('.seek'); if (seek) { seek.value = 0; seek.style.setProperty('--fill','0%'); }
  const cur = pl.querySelector('.t-cur'); if (cur) cur.textContent = '0:00';
}

function playSrc(pl) {
  paraStop();                             // an inline line and the paragraph never play at once
  const src = pl.dataset.src;
  if (activeSrc !== src) {
    resetPlayer(activePlayer());          // hand the audio over from the old line
    activeSrc = src;
    A.src = src;
  }
  A.playbackRate = SPEED;
  A.play().catch(() => {});
  pl.classList.add('playing');
}
function toggleSrc(pl) {
  if (activeSrc === pl.dataset.src && !A.paused) { A.pause(); pl.classList.remove('playing'); }
  else playSrc(pl);
}

A.addEventListener('timeupdate', () => {
  const pl = activePlayer(); if (!pl) return;
  const pct = A.duration ? (A.currentTime / A.duration * 100) : 0;
  const seek = pl.querySelector('.seek');
  if (seek && document.activeElement !== seek) {   // don't fight a finger that's dragging
    seek.value = pct; seek.style.setProperty('--fill', pct + '%');
  }
  const cur = pl.querySelector('.t-cur'); if (cur) cur.textContent = fmt(A.currentTime);
});
A.addEventListener('loadedmetadata', () => {
  const pl = activePlayer(); if (!pl) return;
  const dur = pl.querySelector('.t-dur'); if (dur) dur.textContent = fmt(A.duration);
});
A.addEventListener('ended', () => { const pl = activePlayer(); resetPlayer(pl); });
A.addEventListener('pause', () => { const pl = activePlayer(); if (pl) pl.classList.remove('playing'); });

// Called from the delegated input handler when a scrubber is dragged.
function seekTo(pl, pct) {
  if (activeSrc !== pl.dataset.src) { activeSrc = pl.dataset.src; A.src = pl.dataset.src; }
  const set = () => { A.currentTime = (pct/100) * (A.duration || 0);
                      pl.querySelector('.seek').style.setProperty('--fill', pct + '%'); };
  if (A.duration) set(); else A.addEventListener('loadedmetadata', set, {once:true});
}

// Change speed everywhere; apply live if something is playing. Persisted (SKEY).
function applySpeed(v, pl) {
  setSpeed(v);
  A.playbackRate = v;
  PA.playbackRate = v;
  document.querySelectorAll('.pspd .sb').forEach(b =>
    b.setAttribute('aria-pressed', String(parseFloat(b.dataset.spd) === v)));
}

// The inline player component — one per line. LTR so the scrubber fills left→right even
// though the Arabic around it is RTL. Disabled lines show a plain note instead.
function player(src) {
  if (!src) return `<span class="noaud">no audio yet</span>`;
  return `<div class="player" data-src="${esc(au(src))}" dir="ltr">
      <button class="pp" aria-label="Play / pause"></button>
      <span class="t-cur">0:00</span>
      <input class="seek" type="range" min="0" max="100" value="0" step="0.5"
             aria-label="Seek" style="--fill:0%">
      <span class="t-dur">0:00</span>
      <div class="pspd" role="group" aria-label="Speed">
        ${SPEEDS.map(([v,t]) =>
          `<button class="sb" data-spd="${v}" aria-pressed="${SPEED===v}">${t}</button>`).join('')}
      </div>
    </div>`;
}

// ---------- paragraph player ----------
// The whole passage read as one continuous take. There is no single combined MP3 — the
// audio is per-sentence — so this plays the sentence clips back-to-back behind one transport
// and presents them as a single timeline (cumulative time, one scrubber). It has its own
// <audio> (PA) so it never fights the per-line players, which keep the shared A element.
const PA = new Audio();
PA.preservesPitch = true; PA.mozPreservesPitch = true; PA.webkitPreservesPitch = true;
let PARA = null;   // {el, srcs:[url…], dur:[secs…], i}  — one paragraph player per reader

// Same component as player(), minus a data-src: it's driven by index, not by one clip.
function paraPlayer() {
  return `<div class="player para" data-para="1" dir="ltr">
      <button class="pp" aria-label="Play / pause the whole passage"></button>
      <span class="t-cur">0:00</span>
      <input class="seek" type="range" min="0" max="100" value="0" step="0.5"
             aria-label="Seek" style="--fill:0%">
      <span class="t-dur">0:00</span>
      <div class="pspd" role="group" aria-label="Speed">
        ${SPEEDS.map(([v,t]) =>
          `<button class="sb" data-spd="${v}" aria-pressed="${SPEED===v}">${t}</button>`).join('')}
      </div>
    </div>`;
}

function paraStop() { PA.pause(); if (PARA) PARA.el.classList.remove('playing'); }

function renderNav(active){
  const item = (route, icon, label, ready) =>
    `<button class="navb${route===active?' on':''}" onclick="location.hash='/${route==='home'?'':route}'">
       ${svg(icon)}<span>${esc(label)}</span>${ready===false?'<em>soon</em>':''}</button>`;
  const sec = s => item(s.route, s.icon, s.label, s.ready);
  const inGroup = g => SECTIONS.filter(s => s.group === g);
  let h = item('home', 'home', 'Home', true) + `<div class="side-sep"></div>` +
    inGroup('plan').map(sec).join('');
  GROUPS.forEach(g => {
    const items = inGroup(g.id); if (!items.length) return;
    h += `<div class="side-group">${esc(g.label)}</div>` + items.map(sec).join('');
  });
  h += `<div class="side-sep"></div>` + inGroup('you').map(sec).join('');
